  `;
  function ensureStyle(){ if(!document.getElementById('ag-css')){ const s=document.createElement('style'); s.id='ag-css'; s.textContent=STYLE; document.head.appendChild(s); } }
  function grow(ta){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,160)+'px'; }
  function head(title, sub, extra){ return `<div class="ag-card-head"><span class="ag-badge">${SPARK}</span><div><h3>${h(title)}</h3>${sub?`<p>${h(sub)}</p>`:''}</div>${extra||''}</div>`; }
  // Clickable links and email addresses inside assistant messages (text is escaped first).
  function linkify(text){
    return h(text)
      .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g, '$1<a href="mailto:$2">$2</a>');
  }
  function ticketCard(tk){ return `<div class="ag-ticket" role="status"><span class="ag-ticket-ico" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12"><path d="M3.5 8.4l2.9 2.8 6.1-6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>${h(t('ag_tk_title').replace('{id}', tk.id))}</b><span>${h(t('ag_tk_sub'))}</span></div></div>`; }
  function logHtml(msgs, busy, err){ return msgs.map(m=>`<div dir="auto" class="ag-m ${m.role==='user'?'me':'ai'}">${m.role==='user'?h(m.content):linkify(m.content)}</div>${m.ticket?ticketCard(m.ticket):''}`).join('') + (busy?`<div class="ag-dots" role="status" aria-label="${h(t('ag_writing'))}"><i></i><i></i><i></i></div>`:'') + (err?`<div class="ag-m err">${h(err)}</div>`:''); }
  function chat(box, opts){ // shared chat wiring
    const ta = box.querySelector('textarea'), btn = box.querySelector('.ag-row .btn');
    const go = ()=>{ const v = ta.value.trim(); if(!v || opts.busy()) return; opts.send(v); };
    btn.addEventListener('click', go);
    ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); go(); } if(e.key==='Escape' && opts.esc) opts.esc(); });
    ta.addEventListener('input', ()=>grow(ta));
    box.querySelectorAll('[data-ag-chip]').forEach(c=>c.addEventListener('click', ()=>{ const v=c.getAttribute('data-ag-chip'); if(v==='__paste'){ ta.focus(); ta.placeholder=t('ag_ob_paste_ph'); return; } opts.send(v); }));
    const log = box.querySelector('.ag-log'); if(log) log.scrollTop = log.scrollHeight;
    return ta;
  }

  /* ---------- 1. Mentor onboarding assistant ---------- */
  const ob = { messages:null, draft:{}, missing:['headline','profession','yearsExperience','bio','languages','skills','helpsWith'], busy:false, error:'' };
  const FORM_MAP = { company:'company', profession:'profession', yearsExperience:'experience', bio:'bio', languages:'languages', education:'degree', certifications:'certifications', skills:'skills' };
  function fillForm(onlyEmpty){
    const form = document.getElementById('onboard-form'); if(!form) return;
    Object.entries(FORM_MAP).forEach(([k,name])=>{
      const v = ob.draft[k]; if(v===undefined || v===null || v==='') return;
      const inp = form.querySelector(`[name="${name}"]`); if(!inp || (onlyEmpty && inp.value.trim())) return;
      inp.value = Array.isArray(v) ? v.join(', ') : String(v);
      inp.dispatchEvent(new Event('input', { bubbles:true }));
    });
  }
  function mountOb(box){
    if(!ob.messages) ob.messages = [{ role:'assistant', content:t('ag_ob_hello') }];
    const pct = Math.round(100*(7-ob.missing.length)/7);
    const chips = ob.messages.length<=1 ? `<div class="ag-chips">
        <button type="button" class="ag-chip" data-ag-chip="__paste">${h(t('ag_ob_chip_cv'))}</button>
        <button type="button" class="ag-chip" data-ag-chip="${h(t('ag_ob_chip_q_text'))}">${h(t('ag_ob_chip_q'))}</button></div>` : '';
    box.innerHTML = `<section class="ag-card" aria-label="${h(t('ag_ob_title'))}">${head(t('ag_ob_title'), t('ag_ob_sub'))}
      <div class="ag-card-body">
        <div class="ag-log" aria-live="polite">${logHtml(ob.messages, ob.busy, ob.error)}</div>
        ${chips}
        <div class="ag-row"><textarea rows="1" aria-label="${h(t('ag_ob_ph'))}" placeholder="${h(t('ag_ob_ph'))}"></textarea>
        <button type="button" class="btn btn-primary btn-sm" ${ob.busy?'disabled':''}>${h(t('ag_send'))}</button></div>
        <div class="ag-foot"><span class="ag-progress"><span class="ag-bar"><b style="width:${pct}%"></b></span>${h(ob.missing.length ? t('ag_ob_progress').replace('{p}', pct) : t('ag_ob_ready'))}</span>
        ${ob.messages.length>1?`<button type="button" class="ag-link" data-ag-ob-reset>${h(t('ag_reset'))}</button>`:''}</div>
      </div></section>`;
    chat(box, { busy:()=>ob.busy, send:v=>sendOb(v) });
    const rs = box.querySelector('[data-ag-ob-reset]');
    if(rs) rs.addEventListener('click', ()=>{ ob.messages=null; ob.draft={}; ob.missing=Object.keys(FORM_MAP).slice(0,0).concat(['headline','profession','yearsExperience','bio','languages','skills','helpsWith']); ob.error=''; mountOb(box); });
  }
  async function sendOb(text){
    ob.error=''; ob.messages.push({ role:'user', content:text }); ob.busy=true;
    let box = document.getElementById('ob-ai'); if(box) mountOb(box);
    try{
      const d = await api({ task:'onboard', messages: ob.messages, draft: ob.draft }, true);
      ob.messages.push({ role:'assistant', content: d.reply });
      ob.draft = d.draft || ob.draft; ob.missing = d.missing || [];
      fillForm(false);
    }catch(e){ ob.messages.pop(); ob.error = e.message; }
    ob.busy=false;
    box = document.getElementById('ob-ai');
    if(box){ mountOb(box); const ta = box.querySelector('textarea'); if(ob.error) ta.value = text; ta.focus(); }
  }
  function extraProfileFields(){
    const out = {}; ['helpsWith','seniority','field','industries','idealMentee'].forEach(k=>{ const v = ob.draft[k]; if(v!==undefined && v!=='' && !(Array.isArray(v)&&!v.length)) out[k]=v; });
    return out;
  }

  /* ---------- 2. Booking note helper (client) ---------- */
  function mountNoteHelper(){
    const ta = document.getElementById('book-message');
    if(!ta || ta.parentNode.querySelector('.ag-inline')) return;
    const b = document.createElement('button');
    b.type='button'; b.className='ag-inline'; b.innerHTML = SPARK + `<span>${h(t('ag_note_btn'))}</span>`;
    b.addEventListener('click', async ()=>{
      b.disabled = true; b.querySelector('span').textContent = t('ag_writing');
      try{
        const d = await api({ task:'request_note', text: ta.value, mentorId: (typeof state!=='undefined' && state.mentorId) || '', packageKey: (typeof state!=='undefined' && state.selectedPkg) || '' }, true);
        if(d.note){ ta.value = d.note; ta.dispatchEvent(new Event('input', { bubbles:true })); try{ state.bookMsg = d.note; }catch(e){} }
      }catch(e){ if(typeof toast==='function') toast(e.message); }
      b.disabled = false; b.querySelector('span').textContent = t('ag_note_btn_again');
    });
    ta.insertAdjacentElement('afterend', b);
  }

  /* ---------- 3. Profile coach (mentor dashboard) ---------- */
  const pc = { busy:false, result:null, error:'' };
  function mountProfileCoach(){
    const edit = document.querySelector('.dash-edit');
    const isMentor = typeof myProfile!=='undefined' && myProfile && myProfile.role==='mentor';
    let box = document.getElementById('ag-pc');

    if(!box){ box = document.createElement('div'); box.id='ag-pc'; edit.parentNode.insertBefore(box, edit); }
    const r = pc.result;
    box.innerHTML = `<section class="ag-card ag-pc" aria-label="${h(t('ag_pc_title'))}">${head(t('ag_pc_title'), t('ag_pc_sub'))}
      <div class="ag-card-body">
      ${r ? `<div class="ag-pc-grid"><div class="ag-ring" style="--v:${r.score}"><span><div style="text-align:center">${r.score}<small>/10</small></div></span></div>
          <div>${r.strengths.length?`<b style="color:var(--text)">${h(t('ag_pc_good'))}</b><ul class="ag-list">${r.strengths.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`:''}</div></div>
        <b style="color:var(--text)">${h(t('ag_pc_try'))}</b><ul class="ag-list">${r.suggestions.map(x=>`<li>${h(x)}</li>`).join('')}</ul>
        ${r.headline?`<div class="ag-sug"><h4>${h(t('ag_pc_headline'))}</h4><p>${h(r.headline)}</p><button type="button" class="btn btn-outline btn-sm" data-ag-use="headline">${h(t('ag_pc_use'))}</button></div>`:''}
        ${r.bio?`<div class="ag-sug"><h4>${h(t('ag_pc_bio'))}</h4><p>${h(r.bio)}</p><button type="button" class="btn btn-outline btn-sm" data-ag-use="bio">${h(t('ag_pc_use'))}</button></div>`:''}
        <p class="ag-note" style="margin-top:12px">${h(t('ag_pc_note'))}</p>`

      <div class="ag-acts" style="margin-top:12px"><button type="button" class="btn ${r?'btn-ghost':'btn-primary'} btn-sm" data-ag-pc-run ${pc.busy?'disabled':''}>${h(pc.busy?t('ag_pc_busy'):(r?t('ag_pc_again'):t('ag_pc_run')))}</button></div>
      </div></section>`;
    box.querySelector('[data-ag-pc-run]').addEventListener('click', async ()=>{
      pc.busy=true; pc.error=''; mountProfileCoach();

  /* ---------- 4. After-session follow-up (mentor) ---------- */
  const fu = {}; // reqId -> { step:'notes'|'review'|'sent', notes, draft, busy, error }
  function fuPanel(id){
    const s = fu[id];
    if(s.step==='sent') return `<div class="ag-fu" data-fu-panel="${h(id)}"><div class="ag-card-body"><div class="ag-done"><i>✓</i>${h(t('ag_fu_done'))}</div></div></div>`;
    const notes = s.step==='notes';
    return `<div class="ag-fu" data-fu-panel="${h(id)}">${head(t(notes?'ag_fu_title':'ag_fu_title2'), t(notes?'ag_fu_notes_lbl':'ag_fu_review_lbl'))}
      <div class="ag-card-body">
      <textarea id="fu-${h(id)}" data-fu-text="${h(id)}" aria-label="${h(t(notes?'ag_fu_title':'ag_fu_title2'))}" ${notes?`placeholder="${h(t('ag_fu_notes_ph'))}"`:'style="min-height:230px"'}>${h(notes ? (s.notes||'') : (s.draft||''))}</textarea>
      ${s.error?`<div class="ag-m err">${h(s.error)}</div>`:''}
      <div class="ag-acts">
        ${notes
          ? `<button type="button" class="btn btn-primary btn-sm" data-fu-go="${h(id)}" ${s.busy?'disabled':''}>${h(s.busy?t('ag_writing'):t('ag_fu_write'))}</button>`
          : `<button type="button" class="btn btn-primary btn-sm" data-fu-send="${h(id)}" ${s.busy?'disabled':''}>${h(s.busy?t('ag_sending'):t('ag_fu_send'))}</button>
             <button type="button" class="btn btn-outline btn-sm" data-fu-back="${h(id)}" ${s.busy?'disabled':''}>${h(t('ag_fu_back'))}</button>`}
        <button type="button" class="btn btn-ghost btn-sm" data-fu-close="${h(id)}">${h(t('ag_cancel'))}</button>
      </div></div></div>`;
  }
  function placeFu(id){
    const btn = document.querySelector(`[data-followup="${CSS.escape(id)}"]`); if(!btn) return;
    const card = btn.closest('.req'); if(!card) return;
    const old = card.querySelector('.ag-fu'); if(old) old.remove();
    if(!fu[id]) return;
    card.insertAdjacentHTML('beforeend', fuPanel(id));
  }
  document.addEventListener('input', e=>{ const id = e.target.getAttribute && e.target.getAttribute('data-fu-text'); if(id && fu[id]){ if(fu[id].step==='notes') fu[id].notes = e.target.value; else fu[id].draft = e.target.value; } });
  document.addEventListener('click', async e=>{
    const q = sel => e.target.closest && e.target.closest(sel);
    let b;
    if((b = q('[data-followup]'))){ const id=b.getAttribute('data-followup'); if(fu[id] && fu[id].step!=='sent') delete fu[id]; else fu[id] = { step:'notes', notes:'' }; placeFu(id); const ta=document.getElementById('fu-'+id); if(ta) ta.focus(); return; }
    if((b = q('[data-fu-close]'))){ const id=b.getAttribute('data-fu-close'); delete fu[id]; placeFu(id); return; }
    if((b = q('[data-fu-back]'))){ const id=b.getAttribute('data-fu-back'); fu[id].step='notes'; fu[id].error=''; placeFu(id); return; }

      s.busy=false; placeFu(id); return;
    }
    if((b = q('[data-fu-send]'))){
      const id=b.getAttribute('data-fu-send'), s=fu[id]; s.error=''; s.busy=true; placeFu(id);
      try{ await api({ task:'followup_send', requestId:id, text:s.draft }, true); s.step='sent'; const fb=document.querySelector(`[data-followup="${CSS.escape(id)}"]`); if(fb) fb.setAttribute('data-fu-sent','1'); mountFuBanner(); if(typeof toast==='function') toast(t('ag_fu_sent_toast')); }catch(err){ s.error=err.message; }
      s.busy=false; placeFu(id); return;
    }
  });

  // Nudge on the dashboard: finished sessions often sit inside the collapsed "Past" list.
  function mountFuBanner(){
    const old = document.getElementById('ag-fu-banner'); if(old) old.remove();
    const pending = [...document.querySelectorAll('[data-followup][data-fu-sent="0"]')].filter(b=>!fu[b.getAttribute('data-followup')]);
    if(!pending.length) return;
    const first = pending[0], who = first.getAttribute('data-fu-who') || '';
    const anchor = document.querySelector('.req-past') || first.closest('.req');
    if(!anchor) return;
    const div = document.createElement('div'); div.id='ag-fu-banner';
    div.innerHTML = `<section class="ag-card" style="margin-bottom:16px">${head(pending.length>1 ? t('ag_fu_banner_n').replace('{n}', pending.length) : t('ag_fu_banner_1').replace('{n}', who), t('ag_fu_banner_sub'), `<button type="button" class="btn btn-primary btn-sm" style="margin-inline-start:auto;align-self:center;white-space:nowrap">${h(t('ag_fu_banner_btn'))}</button>`)}</section>`;
    div.querySelector('button').addEventListener('click', ()=>{
      const d = first.closest('details'); if(d) d.open = true;
      const id = first.getAttribute('data-followup'); fu[id] = { step:'notes', notes:'' }; placeFu(id); mountFuBanner();
      const ta = document.getElementById('fu-'+id); if(ta){ ta.scrollIntoView({ block:'center', behavior:'smooth' }); ta.focus({ preventScroll:true }); }
    });
    anchor.parentNode.insertBefore(div, anchor);
  }

  /* ---------- Home: "Tell us where you are" runs the AI matcher ---------- */
  document.addEventListener('click', e=>{
    const ex = e.target.closest && e.target.closest('[data-hm-ex]');
    const ta = document.getElementById('hero-match-input');
    if(ex && ta){ ta.value = ex.getAttribute('data-hm-ex'); ta.focus(); return; }
    if(e.target.closest && e.target.closest('#hero-match-go') && ta){
      const v = ta.value.trim(); if(!v){ ta.focus(); return; }
      state.matchQuery = v; nav('browse');
      setTimeout(()=>{ const b = document.getElementById('match-btn'); if(b) b.click(); window.scrollTo(0,0); }, 60);
    }
  });

  /* ---------- Hero film: one persistent <video>, moved into the arch after every render ---------- */
  (function heroFilm(){
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;                                  // the still poster stays for reduced motion
    const v = document.createElement('video');
    v.className = 'wkv-video'; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
    v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('preload','auto'); v.setAttribute('aria-hidden','true');
    v.poster = '/hero-v9-poster.jpg';
    v.innerHTML = '<source src="/hero-v9.webm?v=wide-motion-1" type="video/webm"><source src="/hero-v9.mp4?v=wide-motion-1" type="video/mp4">';
    v.addEventListener('playing', ()=>v.classList.add('on'));
    function mount(){
      const slot = document.querySelector('.wkv-slot');
      if(slot && v.parentNode !== slot){ slot.appendChild(v); const p = v.play(); if(p && p.catch) p.catch(()=>{}); }
    }
    new MutationObserver(mount).observe(document.getElementById('app') || document.body, { childList:true, subtree:true });
    mount();
  })();

  /* ---------- Home: route cards and quick start run the AI matcher ---------- */
  function runMatch(q){ if(!q) return; state.matchQuery = q; nav('browse'); setTimeout(()=>{ const b = document.getElementById('match-btn'); if(b) b.click(); window.scrollTo(0,0); }, 60); }
  document.addEventListener('click', e=>{
    const r = e.target.closest && e.target.closest('[data-route-q]');
    if(r){ runMatch(r.getAttribute('data-route-q')); return; }
    if(e.target.closest && e.target.closest('#qs-go')){
      const g=document.getElementById('qs-goal'), f=document.getElementById('qs-field'), w=document.getElementById('qs-when');
      runMatch(`${g.value} ${t('qs_field')}: ${f.value}. ${t('qs_when')}: ${w.value}.`);
    }
  });

  /* ---------- 5. Help desk ---------- */
  const hd = { open:false, messages:null, busy:false, error:'' };
  function mountHelp(){
    let btn = document.getElementById('ag-help-btn');
    if(!btn){
      btn = document.createElement('button'); btn.id='ag-help-btn'; btn.className='ag-help-btn'; btn.type='button';
      btn.addEventListener('click', ()=>{ hd.open=!hd.open; drawHelp(); });
      document.body.appendChild(btn);
    }
    btn.innerHTML = hd.open ? `<span aria-hidden="true" style="font-size:20px;line-height:18px;width:18px;text-align:center">×</span><span class="ag-lbl">${h(t('ag_help_close'))}</span>` : `${CHAT}<span class="ag-lbl">${h(t('ag_help_btn'))}</span>`;
    btn.setAttribute('aria-label', hd.open ? t('ag_help_close') : t('ag_help_title'));
    btn.setAttribute('aria-expanded', hd.open?'true':'false');
  }
  function drawHelp(){
    mountHelp();
    let p = document.getElementById('ag-help');
    if(!hd.open){ if(p) p.remove(); return; }
    if(!hd.messages) hd.messages = [{ role:'assistant', content:t('ag_help_hello') }];
    if(!p){ p=document.createElement('div'); p.id='ag-help'; p.className='ag-help'; p.setAttribute('role','dialog'); p.setAttribute('aria-label', t('ag_help_title')); document.body.appendChild(p); }
    const chips = hd.messages.length<=1 ? `<div class="ag-chips">${['ag_help_q1','ag_help_q2','ag_help_q5','ag_help_q3','ag_help_q4'].map(k=>`<button type="button" class="ag-chip" data-ag-chip="${h(t(k))}">${h(t(k))}</button>`).join('')}</div>` : '';
    p.innerHTML = `${head(t('ag_help_title'), t('ag_help_sub'), `<button type="button" class="ag-x" aria-label="${h(t('ag_help_close'))}">×</button>`)}
      <div class="ag-log" aria-live="polite">${logHtml(hd.messages, hd.busy, hd.error)}</div>${chips}
      <div class="ag-row"><textarea rows="1" aria-label="${h(t('ag_help_ph'))}" placeholder="${h(t('ag_help_ph'))}"></textarea><button type="button" class="btn btn-primary btn-sm" ${hd.busy?'disabled':''}>${h(t('ag_send'))}</button></div>`;
    const close = ()=>{ hd.open=false; drawHelp(); const b=document.getElementById('ag-help-btn'); if(b) b.focus(); };
    const ta = chat(p, { busy:()=>hd.busy, esc:close, send: async v=>{
      hd.error=''; hd.messages.push({ role:'user', content:v }); hd.busy=true; drawHelp();
      try{
        const d = await api({ task:'help', messages: hd.messages.map(m=>({ role:m.role, content:m.content })) }, false);
        const msg = { role:'assistant', content:d.reply }; if(d.ticket && d.ticket.id) msg.ticket = d.ticket;
        hd.messages.push(msg);
      }
      catch(err){ hd.messages.pop(); hd.error = err.message; }
      hd.busy=false; drawHelp(); const nt = document.querySelector('#ag-help textarea'); if(nt && hd.error) nt.value=v;
    }});
    p.querySelector('.ag-x').addEventListener('click', close);
    if(!hd.busy) ta.focus();
  }

  /* ---------- hook called after every render ---------- */
  function afterRender(){
    ensureStyle();
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('svg.ar').forEach(v=>{ try{ v.pauseAnimations(); }catch(e){} });
    const box = document.getElementById('ob-ai');
    if(box){ mountOb(box); if(Object.keys(ob.draft).length) fillForm(true); }
    mountNoteHelper();
    mountProfileCoach();
    Object.keys(fu).forEach(placeFu);
    mountFuBanner();
    mountHelp();
  }
  window.WorkarAgents = { afterRender, extraProfileFields };
  if(document.readyState !== 'loading') afterRender(); else document.addEventListener('DOMContentLoaded', afterRender);
})();
</script>
