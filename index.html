  document.querySelectorAll('[data-payout]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const ids = btn.getAttribute('data-payout').split(',').filter(Boolean);
    if(!ids.length || !confirm(T('pay_confirm').replace('{a}', btn.getAttribute('data-amt')).replace('{n}', btn.getAttribute('data-name')))) return;
    btn.disabled = true;
    const { error } = await sb.from('requests').update({ payoutDone: true, payoutAt: new Date().toISOString() }).in('id', ids);
    if(error){ toast(T('pay_fail')); btn.disabled = false; return; }
    toast(T('pay_done')); state.payouts = null; render();
  }));
  const saveBtn = document.getElementById('adm-save');
  if(!saveBtn) return;
  const collect = ()=>{
    const featured = (document.querySelector('input[name="adm-featured"]:checked')||{}).value;
    const packages = Array.from(document.querySelectorAll('tr[data-pk]')).map(tr=>({
      key: tr.getAttribute('data-pk'),
      price: Math.max(0, Number(tr.querySelector('[data-f="price"]').value)||0),
      sessions: Math.max(1, parseInt(tr.querySelector('[data-f="sessions"]').value)||1),
      featured: tr.getAttribute('data-pk')===featured,
      hidden: !tr.querySelector('[data-f="show"]').checked
    }));
    const text = { en:{}, fa:{} };
    document.querySelectorAll('.adm-row').forEach(row=>{
      const key = row.getAttribute('data-key');
      row.querySelectorAll('.adm-txt').forEach(t=>{
        const lang = t.getAttribute('data-lang');
        const v = t.value;
        if(v.trim() && v !== defaultT(lang,key)) text[lang][key] = v;
      });
    });
    const shEl = document.getElementById('adm-share');
    const mentorShare = shEl ? Math.min(100, Math.max(1, Math.round(Number(shEl.value)||75))) : mentorSharePct();
    return { packages, text, mentorShare };
  };
  const persist = async (data, msg)=>{
    saveBtn.disabled = true;
    try{
      await window.__db.doc('site_settings/main').set({ data });
      siteSettings = data; toast(msg); render();
    }catch(err){
      console.error('settings save failed:', err);
      toast(T('adm_save_fail')); saveBtn.disabled = false;
    }
  };
  saveBtn.addEventListener('click', ()=> persist(Object.assign({}, siteSettings, collect()), T('adm_saved')));
  document.getElementById('adm-reset').addEventListener('click', ()=>{
    if(confirm(T('adm_reset_confirm'))) persist({}, T('adm_saved'));
  });
  // live-update the save % column when prices change
  document.querySelectorAll('.adm-in').forEach(inp=>inp.addEventListener('input', ()=>{
    const rows = Array.from(document.querySelectorAll('tr[data-pk]'));
    const val = (tr,f)=>Number(tr.querySelector('[data-f="'+f+'"]').value)||0;
    const base = val(rows[0],'sessions') ? val(rows[0],'price')/val(rows[0],'sessions') : 0;
    rows.forEach(tr=>{
      const ss = val(tr,'sessions'), pr = val(tr,'price');
      const sv = (base && ss>1) ? Math.max(0, Math.round((1 - pr/(base*ss))*100)) : 0;
      tr.children[3].textContent = sv ? sv+'%' : '—';
    });
  }));
}

const PREP_DOMAINS = ['People','Process','Business Environment'];
const PREP_LETTERS = ['A','B','C','D','E','F'];
const prep = { exams:[], purchases:[], attempts:[], loaded:false, loading:false, session:null, screen:'home', pickExam:null, review:'all', busy:false, timer:null };
try{ const saved = localStorage.getItem('workar_prep_session'); if(saved){ prep.session = JSON.parse(saved); } }catch(e){}
function savePrepSession(){ try{ prep.session ? localStorage.setItem('workar_prep_session', JSON.stringify(prep.session)) : localStorage.removeItem('workar_prep_session'); }catch(e){} }

async function loadPrep(force){
  if(!sb || prep.loading || (prep.loaded && !force)) return;
  prep.loading = true;
  try{
    const { data: ex } = await sb.from('exams').select('*').order('sortOrder');
    prep.exams = (ex||[]).filter(e=> e.published || isAdmin());
    if(uid){
      const { data: pu } = await sb.from('exam_purchases').select('examId');
      prep.purchases = (pu||[]).map(p=>p.examId);
      const { data: at } = await sb.from('exam_attempts').select('*').order('createdAt',{ascending:false}).limit(40);
      prep.attempts = at || [];
    } else { prep.purchases = []; prep.attempts = []; }
  }catch(e){ console.error('prep load failed', e); }
  prep.loaded = true; prep.loading = false;
  if(state.view==='prep' || state.view==='prepAdmin') render();
}
function prepHasAccess(ex){ return !!ex && (ex.isFree || isAdmin() || prep.purchases.includes(ex.id) || prep.purchases.includes('all')); }
function prepBest(examId){ const a = prep.attempts.filter(x=>x.examId===examId && x.total); return a.length ? Math.max(...a.map(x=>Math.round(100*x.score/x.total))) : null; }
function prepBundlePrice(){ return Number(siteSettings && siteSettings.prepBundlePrice) || 24.99; }
function prepMoney(n){ n = Number(n)||0; return '$' + (n % 1 ? n.toFixed(2) : n); }
function prepBand(pct){ if(pct>=80) return ['above',T('band_above')]; if(pct>=65) return ['target',T('band_target')]; if(pct>=50) return ['below',T('band_below')]; return ['needs',T('band_needs')]; }
function prepDomLabel(d){ const k='dom_'+String(d).replace(/\s+/g,'_').toLowerCase(); const t=T(k); return t===k ? d : t; }
function prepShuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function prepIsRight(q, sel){ const a=(sel||[]).slice().sort().join(','), b=q.correct.slice().sort().join(','); return a.length>0 && a===b; }
function prepFmtTime(ms){ ms=Math.max(0,ms); const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }

async function startPrepExam(examId, mode, onlyIds){
  const ex = prep.exams.find(e=>e.id===examId);
  if(!ex) return;
  prep.busy = true; render();
  const { data, error } = await sb.from('exam_questions').select('*').eq('examId', examId).order('sortOrder');
  prep.busy = false;
  if(error || !data || !data.length){ toast(T(prepHasAccess(ex) ? 'prep_load_fail' : 'prep_locked_msg')); render(); return; }
  let rows = onlyIds ? data.filter(r=>onlyIds.includes(r.id)) : data;
  const qs = prepShuffle(rows).map(r=>{
    const opts = Array.isArray(r.options) ? r.options : [];
    const cor = (Array.isArray(r.correct) ? r.correct : []).map(Number);
    const order = prepShuffle(opts.map((_,i)=>i));
    return { id:r.id, domain:r.domain||'Process', prompt:r.prompt, options:order.map(i=>opts[i]),
             correct: order.map((oi,di)=>cor.includes(oi)?di:-1).filter(x=>x>=0), explanation:r.explanation||'' };
  });
  const mins = onlyIds ? Math.max(3, Math.round(qs.length*1.28)) : (ex.timeMinutes || Math.round(qs.length*1.28));
  prep.session = { examId, title:ex.title, mode, qs, idx:0, ans:{}, checked:{}, flags:[], startedAt:Date.now(),
                   deadline: mode==='exam' ? Date.now()+mins*60000 : null, finished:false, result:null, isRetry:!!onlyIds };
  prep.pickExam = null; savePrepSession(); nav('prep', { prepScreen:'run' });
}

async function finishPrep(){
  const s = prep.session; if(!s || s.finished) return;
  if(prep.timer){ clearInterval(prep.timer); prep.timer = null; }
  const byDomain = {}; let score = 0;
  s.qs.forEach(q=>{ const ok = prepIsRight(q, s.ans[q.id]); if(ok) score++; const d = byDomain[q.domain] || (byDomain[q.domain]={c:0,t:0}); d.t++; if(ok) d.c++; });
  s.finished = true; s.result = { score, total:s.qs.length, byDomain, usedMs: Date.now()-s.startedAt };
  prep.screen = 'results'; prep.review = 'all'; savePrepSession(); render(); window.scrollTo(0,0);
  if(uid){
    try{
      await sb.from('exam_attempts').insert({ id:'att_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), userId:uid, examId:s.examId, mode:s.isRetry?'retry':s.mode, score, total:s.qs.length, byDomain });
      loadPrep(true);
    }catch(e){ console.error('attempt save failed', e); }
  }
}

function prepRing(pct, size){

      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})" class="pp-ring-arc" style="--c:${c.toFixed(1)}"/>

}

const PREP_DOMAIN_MODULES = { 'People':['stakeholders','resources','communications'], 'Process':['schedule','cost','risk','quality'], 'Business Environment':['integration','procurement','mindset'] };
function prepReviewDashboard(){
  const at = prep.attempts.slice().filter(a=>a.total);
  if(!uid || !at.length){
    return `<div class="rv-empty">
      <h3>${esc(T(uid ? 'rv_empty_t' : 'rv_login_t'))}</h3>
      <p class="muted">${esc(T(uid ? 'prep_history_empty' : 'prep_login_save'))}</p>
      ${uid ? `<button class="btn btn-primary btn-sm" data-tab="test">${esc(T('prep_start'))} →</button>` : `<button class="btn btn-primary btn-sm" data-nav="dashboard">${esc(T('nav_login'))} →</button>`}
    </div>`;
  }
  const pcts = at.map(a=>Math.round(100*a.score/a.total));
  const avg = Math.round(pcts.reduce((x,y)=>x+y,0)/pcts.length), best = Math.max(...pcts);
  const answered = at.reduce((x,a)=>x+a.total,0);
  const agg = {};
  at.forEach(a=>Object.entries(a.byDomain||{}).forEach(([d,v])=>{ const g = agg[d] || (agg[d]={c:0,t:0}); g.c += v.c||0; g.t += v.t||0; }));
  const doms = PREP_DOMAINS.filter(d=>agg[d]);
  const weakest = doms.slice().sort((x,y)=>(agg[x].c/agg[x].t)-(agg[y].c/agg[y].t))[0];
  const [bandCls, bandLbl] = prepBand(avg);
  // trend: oldest -> newest
  const trend = at.slice(0,12).reverse().map(a=>Math.round(100*a.score/a.total));
  const W=560, H=150, pad=26;
  const x = i => trend.length===1 ? W/2 : pad + i*(W-2*pad)/(trend.length-1);
  const y = v => H-pad - v*(H-2*pad)/100;
  const pts = trend.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const recMods = weakest ? (PREP_DOMAIN_MODULES[weakest]||[]).map(id=>PREP_GUIDE.find(m=>m.id===id)).filter(Boolean) : [];
  return `
  <div class="rv-kpis">
    <div class="rv-kpi"><span>${esc(T('rv_taken'))}</span><b>${at.length}</b></div>
    <div class="rv-kpi"><span>${esc(T('rv_avg'))}</span><b>${avg}%</b><em class="pp-band ${bandCls}">${esc(bandLbl)}</em></div>
    <div class="rv-kpi"><span>${esc(T('rv_best'))}</span><b>${best}%</b></div>
    <div class="rv-kpi"><span>${esc(T('rv_answered'))}</span><b>${answered}</b></div>
  </div>

  <div class="rv-grid">
    <div class="rv-card">
      <div class="rv-card-h"><h3>${esc(T('rv_trend'))}</h3><span class="muted">${esc(T('rv_trend_d'))}</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="rv-chart">
        <line x1="${pad}" x2="${W-pad}" y1="${y(80)}" y2="${y(80)}" class="rv-goal"/>
        <text x="${W-pad}" y="${y(80)-6}" text-anchor="end" class="rv-goal-t">${esc(T('rv_goal'))} 80%</text>
        ${trend.length>1 ? `<polyline points="${pts}" class="rv-line"/>` : ''}
        ${trend.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" class="rv-dot"><title>${v}%</title></circle>`).join('')}
      </svg>
    </div>
    <div class="rv-card">
      <div class="rv-card-h"><h3>${esc(T('rv_domains'))}</h3><span class="muted">${esc(T('rv_domains_d'))}</span></div>
      ${doms.map(d=>{ const p = Math.round(100*agg[d].c/agg[d].t); return `<div class="pp-dom" style="margin-bottom:14px;">
        <div class="pp-dom-h"><b>${esc(prepDomLabel(d))}</b><span>${p}%</span></div>
        <div class="pp-bar"><div style="width:${p}%;background:${p>=80?'#4E8A5B':p>=65?'var(--accent)':p>=50?'#C2773A':'#B3412C'}"></div></div>
      </div>`; }).join('')}
    </div>
  </div>

function wirePrep(){
  if(prep.timer){ clearInterval(prep.timer); prep.timer = null; }
  wireGuide();
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ prep.tab = b.getAttribute('data-tab'); render(); }));
  const s = prep.session;
  const on = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click', ()=>{ prep.pickExam = b.getAttribute('data-pick'); render(); }));
  document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click', ()=>{
    if(prep.session && !prep.session.finished && !confirm(T('prep_replace_confirm'))) return;
    startPrepExam(b.getAttribute('data-start'), b.getAttribute('data-mode'));
  }));
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>buyPrep(b.getAttribute('data-buy'))));
  on('pp-resume', ()=>{ prep.screen='run'; if(s && s.mode==='exam' && s.pausedLeft){ s.deadline = Date.now()+s.pausedLeft; delete s.pausedLeft; } render(); });
  on('pp-discard', ()=>{ if(confirm(T('prep_discard_confirm'))){ prep.session=null; savePrepSession(); render(); } });

  if(prep.screen==='run' && s && !s.finished){
    const q = s.qs[s.idx];
    document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click', ()=>prepSelect(parseInt(b.getAttribute('data-opt'),10))));
    on('pp-check', ()=>{ if((s.ans[q.id]||[]).length){ s.checked[q.id]=true; savePrepSession(); render(); } });
    on('pp-next', ()=>{ s.idx=Math.min(s.qs.length-1, s.idx+1); savePrepSession(); render(); window.scrollTo(0,0); });
    on('pp-prev', ()=>{ s.idx=Math.max(0, s.idx-1); savePrepSession(); render(); window.scrollTo(0,0); });
    on('pp-flag', ()=>{ const i=s.flags.indexOf(q.id); if(i>=0) s.flags.splice(i,1); else s.flags.push(q.id); savePrepSession(); render(); });
    const doFinish = ()=>{ const un = s.qs.filter(x=>!(s.ans[x.id]||[]).length).length;
      if(un && !confirm(T('prep_unanswered_confirm').replace('{n}', un))) return; finishPrep(); };
    on('pp-finish', doFinish); on('pp-finish-any', doFinish);
    on('pp-exit', ()=>{ if(s.mode==='exam') s.pausedLeft = Math.max(0, s.deadline-Date.now()); prep.screen='home'; savePrepSession(); render(); });
    document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', ()=>{ s.idx=parseInt(b.getAttribute('data-go'),10); savePrepSession(); render(); }));
    if(s.mode==='exam'){
      const tick = ()=>{ const el=document.getElementById('prep-timer'); const left=s.deadline-Date.now();
        if(el){ el.textContent = prepFmtTime(left); el.classList.toggle('warn', left < 5*60000); }
        if(left<=0){ toast(T('prep_time_up')); finishPrep(); } };
      tick(); prep.timer = setInterval(tick, 1000);
    }
  }
  if(prep.screen==='results' && s && s.finished){
    document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click', ()=>{ prep.review=b.getAttribute('data-review'); render(); }));
    on('pp-retry-wrong', ()=>{ const ids = s.qs.filter(q=>!prepIsRight(q,s.ans[q.id])).map(q=>q.id); startPrepExam(s.examId, 'practice', ids); });
    on('pp-retake', ()=>{ prep.pickExam = s.examId; prep.session=null; savePrepSession(); prep.screen='home'; prep.tab='test'; render(); window.scrollTo(0,0); });
    on('pp-back', ()=>{ prep.screen='home'; prep.tab='review'; render(); window.scrollTo(0,0); });
  }
}
function prepSelect(i){
  const s = prep.session; if(!s || s.finished) return; const q = s.qs[s.idx];
  if(s.mode==='practice' && s.checked[q.id]) return;
  if(i<0 || i>=q.options.length) return;
  let sel = (s.ans[q.id]||[]).slice();
  if(q.correct.length>1){ sel = sel.includes(i) ? sel.filter(x=>x!==i) : sel.concat(i); }
  else sel = [i];
  s.ans[q.id] = sel; savePrepSession(); render();
}
document.addEventListener('keydown', e=>{
  if(state.view!=='prep' || prep.screen!=='run' || !prep.session || prep.session.finished) return;
  if(/input|textarea|select/i.test((e.target && e.target.tagName)||'')) return;
  const k = e.key.toUpperCase();
  const li = PREP_LETTERS.indexOf(k);
  if(li>=0){ prepSelect(li); e.preventDefault(); return; }
  if(/^[1-6]$/.test(k)){ prepSelect(parseInt(k,10)-1); e.preventDefault(); return; }
  if(e.key==='Enter'){ const b = document.getElementById('pp-check') || document.getElementById('pp-next'); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
  if(e.key==='ArrowRight'){ const b=document.getElementById('pp-next'); if(b) b.click(); }
  if(e.key==='ArrowLeft'){ const b=document.getElementById('pp-prev'); if(b && !b.disabled) b.click(); }
});

/* ---------- admin: manage exams & upload questions ---------- */
function prepCsvParse(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function prepCsvToQuestions(text){
  const rows = prepCsvParse(text); if(!rows.length) return { qs:[], errors:['empty'] };
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  const optCols = ['option_a','option_b','option_c','option_d','option_e','option_f'].map(col);
  const qs = [], errors = [];
  rows.slice(1).forEach((r,ri)=>{
    const get = n => { const c=col(n); return c>=0 ? String(r[c]||'').trim() : ''; };
    const prompt = get('question'); const opts = optCols.map(c=>c>=0?String(r[c]||'').trim():'').filter(Boolean);
    const letters = get('correct').toUpperCase().replace(/[^A-F]/g,'').split('');
    const correct = [...new Set(letters.map(l=>PREP_LETTERS.indexOf(l)))].filter(i=>i>=0 && i<opts.length);
    let domain = get('domain') || 'Process';
    const dl = domain.toLowerCase(); domain = dl.startsWith('peo') ? 'People' : dl.startsWith('bus') ? 'Business Environment' : dl.startsWith('pro') ? 'Process' : domain;
    if(!prompt || opts.length<2 || !correct.length){ errors.push(ri+2); return; }
    qs.push({ domain, prompt, options:opts, correct, explanation: get('explanation') });
  });
  return { qs, errors };
}
function prepCsvCell(v){ v = String(v==null?'':v); return /[",\n\r;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function prepDownload(name, text){
  const blob = new Blob(['\uFEFF'+text], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function wirePrepAdmin(){

  on('pa-template', ()=>prepDownload('workar-questions-template.csv', PREP_CSV_HEAD.join(',')+'\n'+

    ['People','Which TWO are signs of psychological safety? (Choose 2)','People admit mistakes','Nobody asks questions','Juniors challenge seniors','Risks are hidden','','A;C','Safety shows up as openness.'].map(prepCsvCell).join(',')+'\n'));
  on('pa-bundle-save', async ()=>{
    const v = Number(document.getElementById('pa-bundle').value)||0; if(v<1){ toast(T('toast_save_fail')); return; }
    const data = Object.assign({}, siteSettings, { prepBundlePrice: v });
    try{ await window.__db.doc('site_settings/main').set({ data }); siteSettings = data; toast(T('toast_saved')); }catch(e){ toast(T('adm_save_fail')); }
  });
  on('pa-new', async ()=>{
    const title = document.getElementById('pa-new-title').value.trim(); if(!title){ toast(T('prep_need_title')); return; }
    const id = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) + '-' + Math.random().toString(36).slice(2,5);
    const { error } = await sb.from('exams').insert({ id, title, subtitle:'', isFree: document.getElementById('pa-new-free').checked,
      priceUsd: Number(document.getElementById('pa-new-price').value)||0, timeMinutes: parseInt(document.getElementById('pa-new-time').value,10)||30,
      sortOrder: prep.exams.length+1, published:false, questionCount:0 });
    if(error){ toast(T('adm_save_fail')); return; }
    toast(T('toast_saved')); loadPrep(true);
  });
  document.querySelectorAll('.pa-exam').forEach(box=>{
    const id = box.getAttribute('data-exam'); const f = n => box.querySelector('[data-f="'+n+'"]');
    box.querySelector('[data-pa="save"]').addEventListener('click', async ()=>{
      const patch = { title:f('title').value.trim(), subtitle:f('subtitle').value.trim(), priceUsd:Number(f('priceUsd').value)||0,
        timeMinutes:parseInt(f('timeMinutes').value,10)||30, isFree:f('isFree').checked, published:f('published').checked };
      const { error } = await sb.from('exams').update(patch).eq('id', id);
      if(error){ toast(T('adm_save_fail')); return; } toast(T('toast_saved')); loadPrep(true);
    });
    box.querySelector('[data-pa="export"]').addEventListener('click', async ()=>{
      const { data } = await sb.from('exam_questions').select('*').eq('examId', id).order('sortOrder');
      const lines = [PREP_CSV_HEAD.join(',')].concat((data||[]).map(q=>{ const o=q.options||[];
        return [q.domain,q.prompt,o[0],o[1],o[2],o[3],o[4],(q.correct||[]).map(i=>PREP_LETTERS[i]).join(';'),q.explanation].map(prepCsvCell).join(','); }));
      prepDownload(id+'.csv', lines.join('\n')+'\n');
    });
    box.querySelector('[data-pa="file"]').addEventListener('change', async ev=>{
      const file = ev.target.files && ev.target.files[0]; if(!file) return;
      const { qs, errors } = prepCsvToQuestions(await file.text());
      ev.target.value = '';
      if(!qs.length){ toast(T('prep_csv_none')); return; }
      const replace = box.querySelector('[data-pa="mode"]').value==='replace';
      if(replace && !confirm(T('prep_replace_confirm2').replace('{n}', qs.length))) return;
      try{
        let start = 0;
        if(replace){ const { error } = await sb.from('exam_questions').delete().eq('examId', id); if(error) throw error; }
        else { const { count } = await sb.from('exam_questions').select('id', { count:'exact', head:true }).eq('examId', id); start = count||0; }
        const stamp = Date.now().toString(36);
        const rows = qs.map((q,i)=>({ id:`${id}-${stamp}-${i+1}`, examId:id, domain:q.domain, prompt:q.prompt, options:q.options, correct:q.correct, explanation:q.explanation, sortOrder:start+i+1 }));
        for(let i=0;i<rows.length;i+=200){ const { error } = await sb.from('exam_questions').insert(rows.slice(i,i+200)); if(error) throw error; }
        const { count } = await sb.from('exam_questions').select('id', { count:'exact', head:true }).eq('examId', id);
        await sb.from('exams').update({ questionCount: count||0 }).eq('id', id);
        toast(T('prep_csv_done').replace('{n}', rows.length) + (errors.length ? ' · ' + T('prep_csv_skipped').replace('{r}', errors.slice(0,8).join(', ')) : ''), 6000);
        loadPrep(true);
      }catch(e){ console.error(e); toast(T('adm_save_fail')); }
    });
    box.querySelector('[data-pa="delete"]').addEventListener('click', async ()=>{
      if(!confirm(T('prep_delete_confirm'))) return;
      const { error } = await sb.from('exams').delete().eq('id', id);
      if(error){ toast(T('adm_save_fail')); return; } toast(T('toast_saved')); loadPrep(true);
    });
  });
}

 ]},

 ]},

// insert one slide per process right after each module's overview slide
(function(){
  const byMod = {};
  PREP_PROCS.forEach(p=>{ (byMod[p[0]] = byMod[p[0]] || []).push(p); });
  PREP_GUIDE.forEach(m=>{
    const list = byMod[m.id]; if(!list) return;
    const slides = list.map(([mod,name,group,purpose,ins,tools,outs,tip])=>({ t:name, blocks:[{ proc:{group,purpose,ins,tools,outs,tip} }] }));
    m.slides.splice(1, 0, ...slides);
    m.mins += Math.round(list.length*1.5);
  });
})();

function prepGuideDone(){ try{ return JSON.parse(localStorage.getItem('workar_guide_done')||'[]'); }catch(e){ return []; } }
function prepGuideMark(id){ try{ const d = prepGuideDone(); if(!d.includes(id)){ d.push(id); localStorage.setItem('workar_guide_done', JSON.stringify(d)); } }catch(e){} }

function prepGuideBlock(b){
  if(b.p) return `<p class="gd-p">${esc(b.p)}</p>`;
  if(b.list) return `<ul class="gd-list">${b.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(b.cards) return `<dl class="gd-dl">${b.cards.map(([t,x])=>`<div><dt>${esc(t)}</dt><dd>${esc(x)}</dd></div>`).join('')}</dl>`;
  if(b.proc){ const pr=b.proc, items = t => t.split(/,\s*/).map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="gd-proc"><span class="gd-proc-g">${esc(pr.group)}</span><p class="gd-proc-p">${esc(pr.purpose)}</p>
      <div class="gd-ito"><div><h4>${esc(T('guide_inputs'))}</h4><ul>${items(pr.ins)}</ul></div><div><h4>${esc(T('guide_tools'))}</h4><ul>${items(pr.tools)}</ul></div><div class="out"><h4>${esc(T('guide_outputs'))}</h4><ul>${items(pr.outs)}</ul></div></div>
      <div class="gd-tip"><b>${esc(T('guide_tip'))}</b> ${esc(pr.tip)}</div></div>`; }
  if(b.table) return `<div class="gd-tablewrap"><table class="gd-table"><thead><tr>${b.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.formula) return `<div class="gd-formulas">${b.formula.map(([l,e,n])=>`<div class="gd-f"><span class="gd-fl">${esc(l)}</span><code>${esc(e)}</code>${n?`<span class="gd-fn">${esc(n)}</span>`:''}</div>`).join('')}</div>`;
  if(b.tip) return `<div class="gd-tip"><b>${esc(T('guide_tip'))}</b> ${esc(b.tip)}</div>`;
  if(b.viz && PREP_VIZ[b.viz]) return `<figure class="gd-fig">${PREP_VIZ[b.viz]()}${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:''}</figure>`;
  if(b.compare) return `<div class="gd-compare">${b.compare.map(([t,x])=>`<div><b>${esc(t)}</b><span>${esc(x)}</span></div>`).join('<div class="gd-vs">vs</div>')}</div>`;
  if(b.scn) return `<div class="gd-scn" data-a="${b.scn.a}"><div class="gd-scn-k">${esc(T('guide_scn'))}</div><p>${esc(b.scn.q)}</p>
    <div class="gd-scn-opts">${b.scn.o.map((o,i)=>`<button class="gd-scn-o" data-i="${i}"><span>${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div class="gd-scn-why" hidden><b></b> ${esc(b.scn.why)}</div></div>`;
  if(b.flow) return `<div class="gd-flow">${b.flow.map((x,i)=>`<div class="gd-step"><span>${i+1}</span>${esc(x)}</div>`).join('<div class="gd-arrow">→</div>')}</div>`;
  return '';
}

const PREP_GUIDE_PARTS = [
  ['guide_part1', ['start','framework','integration']],
  ['guide_part2', ['stakeholders','scope','schedule','cost']],
  ['guide_part3', ['quality','resources','communications','risk','procurement']],
  ['guide_part4', ['agile','formulas','mindset']]
];
function prepGuideHome(){
  const done = prepGuideDone().filter(id=>PREP_GUIDE.some(m=>m.id===id));
  const n = PREP_GUIDE.length, pct = Math.round(100*done.length/n);
  const next = PREP_GUIDE.find(m=>!done.includes(m.id));
  const nextIdx = next ? PREP_GUIDE.indexOf(next) : -1;
  return `
  <div class="lx">
    <div class="lx-progress">
      <div class="lx-progress-top">
        <span><b>${pct}%</b> · ${done.length}/${n} ${esc(T('guide_modules'))}</span>
        ${next ? `<button class="lx-cta" data-guide="${next.id}">${esc(T(done.length ? 'guide_continue_btn' : 'guide_begin_btn'))}: ${String(nextIdx+1).padStart(2,'0')} ${esc(next.title)} →</button>`
               : `<button class="lx-cta" data-tab="test">${esc(T('guide_test_now'))} →</button>`}
      </div>
      <div class="lx-bar"><div style="width:${pct}%"></div></div>
    </div>
    ${PREP_GUIDE_PARTS.map(([pk, ids], pi)=>{
      const mods = ids.map(id=>PREP_GUIDE.find(m=>m.id===id)).filter(Boolean);
      return `<section class="lx-part">
        <h3 class="lx-part-h">${esc(T('guide_part'))} ${pi+1} · ${esc(T(pk))}</h3>
        ${mods.map(m=>{ const i = PREP_GUIDE.indexOf(m), isDone = done.includes(m.id), isNext = next && next.id===m.id;
          return `<button class="lx-row ${isDone?'done':''} ${isNext?'next':''}" data-guide="${m.id}">
            <span class="lx-num">${isDone ? '✓' : String(i+1).padStart(2,'0')}</span>
            <span class="lx-title">${esc(m.title)}</span>
            <span class="lx-meta">${m.mins} ${esc(T('prep_min'))}</span>
          </button>`; }).join('')}
      </section>`; }).join('')}
  </div>`;
}

function prepGuideView(){
  const g = prep.guide || {}; const mi = PREP_GUIDE.findIndex(m=>m.id===g.mod);
  if(mi<0){ prep.screen='home'; return prepHomeView(); }
  const m = PREP_GUIDE[mi], si = Math.min(g.slide||0, m.slides.length-1), sl = m.slides[si];
  const last = si===m.slides.length-1, next = PREP_GUIDE[mi+1];
  if(last) prepGuideMark(m.id);
  return `
  <div class="gd-viewer">
    <div class="pp-top" style="margin-bottom:12px;">
      <button class="btn btn-ghost btn-sm" id="gd-back">← ${esc(T('guide_all'))}</button>
      <select class="gd-jump" id="gd-jump">${m.slides.map((x,i)=>`<option value="${i}" ${i===si?'selected':''}>${i+1}. ${esc(x.t)}</option>`).join('')}</select>
    </div>
    <div class="gd-slide" dir="ltr">
      <div class="gd-crumb"><span>${String(mi+1).padStart(2,"0")} · ${esc(m.title)}</span><span>${si+1} / ${m.slides.length}</span></div><div class="gd-thin"><div style="width:${Math.round(100*(si+1)/m.slides.length)}%"></div></div>
      <div class="gd-body">
        <h2 class="gd-title">${esc(sl.t)}</h2>
        ${sl.blocks.map(prepGuideBlock).join('')}
      </div>
    </div>
    <div class="gd-nav">
      <button class="btn btn-outline btn-sm" id="gd-prev" ${si===0?'disabled':''}>← ${esc(T('prep_prev'))}</button>
      <div class="gd-dots">${m.slides.length<=12 ? m.slides.map((_,i)=>`<button class="gd-dot ${i===si?'on':''}" data-slide="${i}" aria-label="${i+1}"></button>`).join('') : `<span class="muted" style="font-size:13px;">${si+1} / ${m.slides.length}</span>`}</div>
      ${!last ? `<button class="btn btn-primary btn-sm" id="gd-next">${esc(T('prep_next'))} →</button>` : `<span></span>`}
    </div>
    ${last ? `<div class="gd-end">
      <b>${esc(T('guide_done_t').replace('{m}', m.title))}</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;">
        ${next ? `<button class="btn btn-primary btn-sm" data-guide="${next.id}">${esc(T('guide_next_mod'))}: ${esc(next.title)} →</button>` : ''}
        <button class="btn btn-outline btn-sm" id="gd-test">${esc(T('guide_test_now'))}</button>
      </div>
    </div>` : ''}
    <div class="pp-keys">${esc(T('guide_keys'))}</div>
  </div>`;
}

function wireGuide(){
  document.querySelectorAll('[data-guide]').forEach(b=>b.addEventListener('click', ()=>{ prep.guide = { mod:b.getAttribute('data-guide'), slide:0 }; prep.tab='learn'; nav('prep', { prepScreen:'learn' }); }));
  if(prep.screen!=='learn') return;
  const g = prep.guide; const m = PREP_GUIDE.find(x=>x.id===g.mod); if(!m) return;
  const go = i => { g.slide = Math.max(0, Math.min(m.slides.length-1, i)); render(); };
  const on = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  on('gd-prev', ()=>go(g.slide-1)); on('gd-next', ()=>go(g.slide+1));
  on('gd-back', ()=>{ prep.screen='home'; prep.tab='learn'; render(); window.scrollTo(0,0); });
  on('gd-test', ()=>{ prep.screen='home'; prep.tab='test'; prep.pickExam = (prep.exams.find(e=>e.isFree)||{}).id || null; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click', ()=>go(parseInt(b.getAttribute('data-slide'),10))));
  const jump = document.getElementById('gd-jump'); if(jump) jump.addEventListener('change', ()=>go(parseInt(jump.value,10)));
  document.querySelectorAll('.gd-scn').forEach(box=>{
    const ans = parseInt(box.getAttribute('data-a'),10);
    box.querySelectorAll('.gd-scn-o').forEach(btn=>btn.addEventListener('click', ()=>{
      if(box.classList.contains('answered')) return;
      box.classList.add('answered');
      const i = parseInt(btn.getAttribute('data-i'),10);
      box.querySelectorAll('.gd-scn-o').forEach(o=>{ const k=parseInt(o.getAttribute('data-i'),10); o.classList.add(k===ans?'ok':(k===i?'no':'dim')); o.disabled=true; });
      const why = box.querySelector('.gd-scn-why'); why.hidden=false;
      why.classList.add(i===ans?'ok':'no'); why.querySelector('b').textContent = T(i===ans?'prep_correct':'prep_incorrect');
    }));
  });
}
document.addEventListener('keydown', e=>{
  if(state.view!=='prep' || prep.screen!=='learn') return;
  if(/input|textarea|select/i.test((e.target && e.target.tagName)||'')) return;
  if(e.key==='ArrowRight'){ const b=document.getElementById('gd-next'); if(b){ b.click(); e.preventDefault(); } }
  if(e.key==='ArrowLeft'){ const b=document.getElementById('gd-prev'); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
});

function wireAuth(){
  document.querySelectorAll('[data-auth-mode]').forEach(b=>b.addEventListener('click', ()=>{
    const em = document.querySelector('#auth-form input[name="email"]'); if(em && em.value) state.authEmail = em.value.trim();
    state.authMode = b.getAttribute('data-auth-mode'); state.authError = ''; state.authCheckEmail = false; state.authInfo = ''; render();
  }));
  document.querySelectorAll('.pw-eye').forEach(b=>b.addEventListener('click', ()=>{
    const inp = b.parentNode.querySelector('input'); const show = inp.type==='password';
    inp.type = show ? 'text' : 'password'; b.classList.toggle('on', show); b.setAttribute('aria-label', T(show ? 'pw_hide' : 'pw_show'));
  }));
  const toggle = document.getElementById('auth-toggle');
  if(toggle) toggle.addEventListener('click', (e)=>{
    e.preventDefault();
    state.authMode = (state.authMode==='signup') ? 'login' : (state.authMode==='forgot' ? 'login' : 'signup');
    state.authError = ''; state.authCheckEmail = false; state.authInfo = '';
    render();
  });
  const forgotLink = document.getElementById('auth-forgot');
  if(forgotLink) forgotLink.addEventListener('click', (e)=>{
    e.preventDefault();
    const em = document.querySelector('#auth-form input[name="email"]');
    if(em && em.value) state.authEmail = em.value.trim();
    state.authMode = 'forgot'; state.authError = ''; state.authInfo = ''; state.authCheckEmail = false;
    render();
  });
  const resendBtn = document.getElementById('auth-resend');
  if(resendBtn) resendBtn.addEventListener('click', async ()=>{
    if(!state.authEmail) return;
    state.resendBusy = true; render();
    try{
      const { error } = await withTimeout(sb.auth.resend({ type:'signup', email: state.authEmail, options:{ emailRedirectTo: window.location.origin } }), 8000, 'resend');
      if(error) throw error;
      state.resendDone = true;
    }catch(err){ state.authError = (err && err.message) || T('auth_error_generic'); }
    state.resendBusy = false; render();
  });
  const form = document.getElementById('auth-form');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(state.authBusy) return;
    const fd = new FormData(form);
    const email = (fd.get('email')||'').trim();
    const password = fd.get('password')||'';
    state.authBusy = true; state.authError = ''; render();
    try{
      if(state.authMode==='forgot'){
        state.authEmail = email;
        const { error } = await withTimeout(sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin }), 8000, 'resetPassword');
        if(error) throw error;
        state.authBusy = false; state.authMode = 'login'; state.authInfo = T('reset_sent'); render();
        return;
      }
      if(state.authMode==='signup'){
        if(password !== (fd.get('password2')||'')){
          state.authBusy = false; state.authError = T('pw_mismatch'); render();
          const em = document.querySelector('#auth-form input[name="email"]'); if(em) em.value = email;
          return;
        }
        const { data, error } = await withTimeout(sb.auth.signUp({ email, password, options:{ emailRedirectTo: window.location.origin } }), 8000, 'signUp');
        if(error) throw error;
        state.authEmail = email;
        if(data.session){
          onSignedIn(data.session);
        } else if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          // email already registered
          state.authBusy = false; state.authMode = 'login'; state.authCheckEmail = false;
          state.authInfo = T('auth_already_registered'); render();
        } else {
          state.authBusy = false; state.authMode = 'login'; state.authCheckEmail = true;
          state.resendDone = false; state.authInfo = ''; render();
        }
      } else {
        state.authEmail = email;
        const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password }), 8000, 'signInWithPassword');
        if(error){
          if(/not confirmed/i.test(error.message||'')){ state.authBusy=false; state.authCheckEmail=true; state.authError=''; render(); return; }
          throw error;
        }
        onSignedIn(data.session);
      }
    }catch(err){
      state.authBusy = false;
      state.authError = (err && err.message) || T('auth_error_generic');
      render();
    }
  });
}

function bookingCalendarData(r){
  if(!uid || !r || (r.mentorId!==uid && r.clientId!==uid) || r.status!=='accepted' || reqStage(r)!==2) return null;
  const start = reqInstant(r);
  if(!start || !Number.isFinite(start.getTime())) return null;
  const stamp = d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const title = 'Workar session with '+nameOf(r.mentorId===uid ? r.clientId : r.mentorId);
  const url = (r.meetingUrl || ('https://meet.jit.si/Workar-Session-'+encodeURIComponent(r.id))) + '?lang=en#config.defaultLanguage=%22en%22';
  const dates = stamp(start)+'/'+stamp(new Date(start.getTime()+SESSION_MIN*60000));
  return { title, url, dates, google:'https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:title,dates,details:'Join your Workar session: '+url,location:url}) };
}
function bookingCalendarActions(r){
  const event = bookingCalendarData(r); if(!event) return '';
  return `<a class="btn btn-sm btn-outline" href="${esc(event.google)}" target="_blank" rel="noopener">${esc(T('calendar_google'))}</a><button class="btn btn-sm btn-ghost" data-calendar-download="${esc(r.id)}">${esc(T('calendar_download'))}</button>`;
}
function bookingCalendarIcs(r, event){
  const text = s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const fold = line=>{ const out=[]; let value='',size=0; const encoder=new TextEncoder(); for(const ch of line){ const n=encoder.encode(ch).length; if(size+n>75){out.push(value);value=' ';size=1;} value+=ch;size+=n; } out.push(value);return out.join('\r\n'); };
  const [start,end]=event.dates.split('/');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Workar//Sessions//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+text(r.id)+'@workar.me','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+text(event.title),'DESCRIPTION:'+text('Join your Workar session: '+event.url),'LOCATION:'+text(event.url),'STATUS:CONFIRMED'];
  for(const minutes of [60,15]) lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+text(event.title),'TRIGGER:-PT'+minutes+'M','END:VALARM');
  lines.push('END:VEVENT','END:VCALENDAR');return lines.map(fold).join('\r\n')+'\r\n';
}
document.addEventListener('click', e=>{

  const r=(cache.requests||[]).find(x=>x.id===button.getAttribute('data-calendar-download')), event=bookingCalendarData(r); if(!event) return;
  const url=URL.createObjectURL(new Blob([bookingCalendarIcs(r,event)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='workar-session.ics'; document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
});

function reqStage(r){ if(r.status==='declined' || r.status==='cancelled') return -1; if(r.status==='pending') return 0; if(r.amountCents>0 && !r.paid) return 1; const done = (Number(r.sessionsDone)||0) >= reqSessionsTotal(r); return done ? 3 : 2; }

function convMessages(o){
  const reqs = (cache.requests||[]).filter(r=>(r.mentorId===uid && r.clientId===o) || (r.clientId===uid && r.mentorId===o));
  const all = [].concat(...reqs.map(r=>cache.msgs[r.id]||[]), cache.dms[dmId(uid,o)]||[]);

function conversations(){
  const people = new Set();
  (cache.requests||[]).forEach(r=>{ const o = r.mentorId===uid ? r.clientId : r.mentorId; if(o && o!==uid) people.add(o); });
  Object.keys(cache.dms).forEach(t=>{ const o = t.slice(3).split('_').find(x=>x!==uid); if(o) people.add(o); });
  if(state.inboxWith && state.inboxWith!==uid) people.add(state.inboxWith);
  const hid = hiddenConvs();
  return [...people].map(o=>{
    const msgs = convMessages(o), last = msgs[msgs.length-1];
    const reqs = (cache.requests||[]).filter(r=>(r.mentorId===uid && r.clientId===o) || (r.clientId===uid && r.mentorId===o));
    const lastT = Math.max(last ? new Date(last.createdAt).getTime() : 0, ...reqs.map(r=>Number(r.createdAt)||0));
    let seen = 0; try{ seen = Number(localStorage.getItem(convSeenKey(o)))||0; }catch(e){}
    const unread = msgs.filter(m=>m.senderId!==uid && new Date(m.createdAt).getTime() > seen).length;

const pj = { stream:null, audioCtx:null, raf:0, mic:true, cam:true, reqId:null, url:'', timer:0, generation:0, focus:null };
function pjStop(){
  try{ if(pj.stream) pj.stream.getTracks().forEach(t=>t.stop()); }catch(e){}

function pjClose(){ pj.generation++; pjStop(); const el = document.getElementById('pj-back'); if(el) el.remove(); document.removeEventListener('keydown', pjKey); if(pj.focus && pj.focus.isConnected) pj.focus.focus(); pj.focus=null; }
function pjKey(e){

  if(e.key==='Tab'){
    const buttons = Array.from(document.querySelectorAll('#pj-back button')).filter(b=>!b.disabled);
    const first=buttons[0], last=buttons[buttons.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }

}
function pjWhen(r){
  const i = r && typeof reqInstant==='function' ? reqInstant(r) : null;
  if(!i) return { cls:'', text: T('pj_anytime') };
  const diff = i.getTime() - Date.now(), mins = Math.round(diff/60000);
  if(diff <= 0 && diff > -SESSION_MIN*60000) return { cls:'live', text: T('pj_live') };
  if(diff <= -SESSION_MIN*60000) return { cls:'', text: T('pj_ended').replace('{d}', fmtLocalDay(i)).replace('{t}', fmtLocalTime(i)) };
  if(mins < 60) return { cls:'', text: T('pj_in_min').replace('{n}', Math.max(1, mins)) };
  return { cls:'', text: T('pj_at').replace('{d}', fmtLocalDay(i)).replace('{t}', fmtLocalTime(i)) };

async function uploadPhoto(file){
  if(!file || !sb || !uid) return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ toast(T('ph_type')); return; }
  toast(T('ph_uploading'));
  try{
    const img = await new Promise((ok, bad)=>{ const i = new Image(); i.onload = ()=>ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); });
    const side = Math.min(img.width, img.height), S = 480;              // centre-crop to a square, 480px
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    c.getContext('2d').drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
    const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.86));
    const path = uid + '/' + Date.now() + '.jpg';
    const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000' });
    if(error) throw error;
    const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    const old = myProfile.avatarUrl;
    await saveProfileSafe({ avatarUrl: url }, 'update');
    myProfile.avatarUrl = url; if(cache.profiles[uid]) cache.profiles[uid].avatarUrl = url;
    if(old){ const m = old.split('/avatars/')[1]; if(m) sb.storage.from('avatars').remove([m]).catch(()=>{}); }
    toast(T('ph_done')); render();
  }catch(e){ console.error('photo', e); toast(T('ph_fail')); }
}

function reqListHtml(myReqs, isMentor){
  if(!myReqs.length) return `<div class="empty">${esc(T('no_requests'))}</div>`;
  const hid = hiddenReqs();
  const vis = myReqs.filter(r=>!hid.includes(r.id));
  const closed = vis.filter(r=>{ const st = reqStage(r); return st<0 || st===3; });
  const active = vis.filter(r=>!closed.includes(r))
    .sort((x,y)=>(reqNeedsAction(y,isMentor)-reqNeedsAction(x,isMentor)) || ((Number(y.createdAt)||0)-(Number(x.createdAt)||0)));
  // group by the other person, keeping the order of each person's most urgent request
  const order = [], by = {};
  active.forEach(r=>{ const o = isMentor ? r.clientId : r.mentorId; if(!by[o]){ by[o]=[]; order.push(o); } by[o].push(r); });
  const groups = order.map(o=>{
    const list = by[o];
    if(list.length===1) return reqCard(list[0], isMentor);
    const person = cache.people[o] || cache.profiles[o] || {};
    return `<div class="req-group">
      <div class="req-group-head"><div class="avatar">${av(o)}</div>
        <div><b>${esc(nameOf(o))}</b><span class="muted">${esc(T('grp_count').replace('{n}', list.length))}${isMentor && person.profession ? ' · ' + esc(T('dash_aiming').replace('{p}', person.profession)) : ''}</span></div></div>
      ${list.map(r=>reqCard(r, isMentor, true)).join('')}
    </div>`;
  }).join('');
  return `${active.length ? `<div class="req-list">${groups}</div>` : `<div class="empty">${esc(T('no_active_requests'))}</div>`}
    ${closed.length ? `<section class="past">
        <div class="past-head"><h3>${esc(T('past_title').replace('{n}', closed.length))}</h3>
          <button type="button" class="past-clear" data-clear-past="${closed.map(r=>r.id).join(',')}">${esc(T('past_clear'))}</button></div>
        <div class="past-list">${closed.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0)).map(r=>reqRowClosed(r,isMentor)).join('')}</div>
      </section>` : ''}
    ${hid.some(id=>myReqs.find(r=>r.id===id)) ? `<button class="btn btn-ghost btn-sm" id="unhide-reqs" style="margin-top:10px;">${esc(T('mg_unhide'))}</button>` : ''}`;
}
async function updateReq(id, patch){
  let d = Object.assign({}, patch), data, error;
  for(let i=0;i<8;i++){
    ({ data, error } = await sb.from('requests').update(d).eq('id', id).select('id'));
    const m = error && /'([^']+)' column/.exec(error.message||'');
    if(m && m[1] in d){ delete d[m[1]]; continue; }
    break;
  }
  if(error) throw error;
  if(!data || !data.length) throw new Error(T('mg_perm'));
  const r = cache.requests.find(x=>x.id===id); if(r) Object.assign(r, patch);
}

  <div class="coach-modes">${modes.map(([m,l])=>`<div class="mode-btn ${state.coachMode===m?'active':''}" data-mode="${m}">${esc(l)}</div>`).join('')}</div>
  ${showRolePrompt ? `
  <div class="panel">
    <div class="field"><label>${esc(T('interview_role_lbl'))}</label><input id="interview-role" placeholder="${esc(T('ph_interview_role'))}" value="${esc(state.interviewRole||'')}"></div>
    <button class="btn btn-primary" id="start-interview">${esc(T('start_interview'))}</button>
  </div>` : `
  ${voiceControls}
  <div class="chat">
    <div class="chat-log" id="chat-log">
      ${state.chatMsgs.length ? state.chatMsgs.map((m,i)=>`<div class="msg ${m.role==='user'?'user':'ai'}">${m.role==='user' ? esc(m.content) : mdLite(m.content)}${(m.role==='ai' && state.coachMode==='interview' && window.speechSynthesis) ? `<div><button class="btn btn-ghost btn-sm replay-btn" type="button" data-msg-i="${i}" style="padding:2px 8px;margin-top:6px;">${esc(T('replay_audio'))}</button></div>` : ''}</div>`).join('')
        : `<div class="empty" style="border:none;">${state.coachMode==='resume' ? esc(T('empty_resume')) : esc(T('empty_career'))}</div>`}
      ${state.sending ? `<div class="msg ai">${esc(T('thinking'))}</div>` : ''}
    </div>
    ${isOut ? `
    <div class="panel" style="margin-top:0;">
      <p style="margin:0 0 10px;">${esc(T('ai_out_of_credits'))}</p>
      <button class="btn btn-primary" id="buy-ai-credits">${esc(T('buy_ai_credits'))}</button>
    </div>` : `
    <div class="chat-input">
      <textarea id="chat-text" rows="2" placeholder="${state.coachMode==='interview' ? esc(T('ph_chat_interview')) : (state.coachMode==='resume' ? esc(T('ph_chat_resume')) : esc(T('ph_chat_career')))}"></textarea>
      <button class="btn btn-primary" id="chat-send" ${state.sending?'disabled':''}>${esc(T('send'))}</button>
    </div>`}
  </div>${state.coachMode==='interview' ? `<button class="btn btn-ghost btn-sm" id="end-interview" style="margin-top:12px;">${esc(T('restart_interview'))}</button>` : ''}`}`;
}

function wire(){
  document.querySelectorAll('[data-nav]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const view = node.getAttribute('data-nav');
      const params = {};
      if(node.hasAttribute('data-mentor')) { params.mentorId = node.getAttribute('data-mentor'); params.bookingOpen = false; }
      if(node.hasAttribute('data-role')) params.role = node.getAttribute('data-role');
      if(view==='onboard') params.role = node.getAttribute('data-role') || state.role || null;
      nav(view, params);
    });
  });

  const bookSignup = document.getElementById('book-signup');
  if(bookSignup) bookSignup.addEventListener('click', ()=>{
    nav('onboard', { role:'client', returnMentorId: bookSignup.getAttribute('data-mentor-id') });
  });

  const langBtn = document.getElementById('lang-toggle');
  if(langBtn) langBtn.addEventListener('click', (e)=>{ e.stopPropagation(); state.langMenu = !state.langMenu; render(); });
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); state.langPrompt = false; setLanguage(b.getAttribute('data-lang')); }));

  const signoutBtn = document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click', async ()=>{ await sb.auth.signOut(); });

  document.querySelectorAll('.role-opt').forEach(node=>{
    node.addEventListener('click', ()=>{ state.role = node.getAttribute('data-role'); render(); });
  });

  wireFirstJob(); wireMentorPreview();
  const dEdit = document.querySelector('.dash-edit'); if(dEdit) dEdit.addEventListener('toggle', ()=>{ state.dashEditOpen = dEdit.open; });
  const form = document.getElementById('onboard-form');
  if(form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    let linkedinVal = (fd.get('linkedin')||'').trim();
    if(linkedinVal && !/^https?:\/\//i.test(linkedinVal)) linkedinVal = 'https://'+linkedinVal;
    const doc = { role: state.role, name: fd.get('name')||'', profession: fd.get('profession')||'', bio: fd.get('bio')||'', linkedin: linkedinVal, aiCredits: 5, timezone: MY_TZ };
    doc.skills = (fd.get('skills')||'').split(',').map(s=>s.trim()).filter(Boolean);
    doc.degree = (fd.get('degree')||'').trim(); doc.university = (fd.get('university')||'').trim();
    doc.education = [doc.degree, doc.university].filter(Boolean).join(', ');
    doc.certifications = splitList(fd.get('certifications'));
    doc.formats = checkedVals(form, 'formats');
    if(state.role==='client'){
      doc.currentProfession = readCurrentJob(form.querySelector('.cur-job'));
      doc.goals = checkedVals(form, 'goals');
      doc.careerStage = fd.get('careerStage')||'';
      doc.targetField = (fd.get('targetField')||'').trim();
    }
    if(state.role==='mentor'){
      doc.company = (fd.get('company')||'').trim();
      doc.headline = doc.company ? `${doc.profession} ${T('at_word')} ${doc.company}` : doc.profession;
      doc.experience = fd.get('experience')||'';
      doc.languages = (fd.get('languages')||'').split(',').map(s=>s.trim()).filter(Boolean);
      doc.sessionRate = Math.max(minRate(), Number(fd.get('sessionRate'))||minRate());
      if(window.WorkarAgents) Object.assign(doc, WorkarAgents.extraProfileFields());
    }
    try{
      state.onboardError = '';
      await saveProfileSafe(doc, 'set');
      toast(T('toast_profile_created'));
      if(state.role==='mentor') notify('mentor_applied');
      if(state.role==='client' && state.returnMentorId){
        const back = state.returnMentorId; state.returnMentorId = null;
        nav('mentor', { mentorId: back, bookingOpen: true });
      } else {
        nav(state.role==='mentor' ? 'dashboard' : 'browse');
      }
    }catch(err){
      console.error('profile create failed:', err);
      toast(T('toast_save_fail'));
      const box = document.getElementById('onboard-err');
      if(box){ box.textContent = T('onboard_err') + ' (' + (err && err.message ? err.message : 'unknown error') + ')'; box.style.display = 'block'; box.scrollIntoView({block:'center'}); }
    }
  });

  const msBtn = document.getElementById('lang-ms-btn');
  if(msBtn) msBtn.addEventListener('click', e=>{ e.stopPropagation(); state.langOpen = !state.langOpen; state.langSearch=''; { const cur = Array.isArray(state.langFilter)?state.langFilter:[]; const have = [...new Set(Object.values(cache.profiles).flatMap(mentorLangs))]; state.langOrder = [...new Set(cur.concat(have, WORLD_LANGS))]; } render(); const si=document.getElementById('lang-ms-search'); if(si) si.focus(); });
  const msPanel = document.getElementById('lang-ms-panel');
  if(msPanel){
    msPanel.addEventListener('click', e=>e.stopPropagation());
    const si = document.getElementById('lang-ms-search');
    const filterList = ()=>{ const q = (si.value||'').trim().toLowerCase(); msPanel.querySelectorAll('.ms-opt').forEach(o=>{ o.style.display = !q || o.getAttribute('data-name').includes(q) ? '' : 'none'; }); };
    if(si){ si.value = state.langSearch||''; filterList(); si.addEventListener('input', ()=>{ state.langSearch = si.value; filterList(); });
      si.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const first = [...msPanel.querySelectorAll('.ms-opt')].find(o=>o.style.display!=='none'); if(first) first.querySelector('input').click(); else if(si.value.trim()){ const v = normLang(si.value); const cur = Array.isArray(state.langFilter)?state.langFilter:[]; if(!cur.includes(v)) state.langFilter = cur.concat(v); state.langSearch=''; render(); } } if(e.key==='Escape'){ state.langOpen=false; render(); } }); }
    msPanel.querySelectorAll('.ms-opt input').forEach(cb=>cb.addEventListener('change', ()=>{
      const cur = Array.isArray(state.langFilter) ? state.langFilter.slice() : [];
      const v = cb.value; state.langFilter = cb.checked ? (cur.includes(v)?cur:cur.concat(v)) : cur.filter(x=>x!==v);
      const scroll = msPanel.querySelector('.ms-list').scrollTop;
      render();
      const np = document.getElementById('lang-ms-panel'); if(np){ np.querySelector('.ms-list').scrollTop = scroll; const nsi=document.getElementById('lang-ms-search'); if(nsi) nsi.focus(); }
    }));
    const clr = document.getElementById('lang-ms-clear'); if(clr) clr.addEventListener('click', ()=>{ state.langFilter=[]; render(); });
    const dn = document.getElementById('lang-ms-done'); if(dn) dn.addEventListener('click', ()=>{ state.langOpen=false; state.langSearch=''; render(); });
  }
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      state.query = searchInput.value; render();
      const si = document.getElementById('search-input');
      si.focus(); si.selectionStart = si.value.length;
    });
  }

  const reqBtn = document.getElementById('request-btn');
  if(reqBtn) reqBtn.addEventListener('click', ()=>{ state.bookingOpen = true; state.selectedSlot = null; render(); });
  const bd = document.getElementById('book-date'), bt = document.getElementById('book-time');
  const syncOwn = ()=>{
    const d = bd && bd.value, t = bt && bt.value;
    state.selectedSlot = d ? { date:d, time:t||'', local:true } : null;
    render();
  };
  if(bd) bd.addEventListener('change', syncOwn);
  if(bt) bt.addEventListener('change', syncOwn);
  document.querySelectorAll('input[name="pkg"]').forEach(r=>r.addEventListener('change', ()=>{ state.selectedPkg = r.value; render(); }));
  document.querySelectorAll('.card-book').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    nav('mentor', { mentorId: btn.getAttribute('data-book'), bookingOpen: !!myProfile, selectedSlot: null });
  }));

  const adminSaveBtn = document.getElementById('admin-save-profile');
  if(adminSaveBtn) adminSaveBtn.addEventListener('click', async ()=>{
    const patch = {
      name: document.getElementById('admin-edit-name').value,
      headline: document.getElementById('admin-edit-headline').value,
      bio: document.getElementById('admin-edit-bio').value,
    };
    try{ await window.__db.doc('profiles/'+state.mentorId).update(patch); toast(T('toast_saved')); }
    catch(err){ console.error('admin edit failed:', err); toast(T('toast_save_fail')); }
  });

  const adminDeleteBtn = document.getElementById('admin-delete-profile');
  if(adminDeleteBtn) adminDeleteBtn.addEventListener('click', async ()=>{
    if(!confirm(T('confirm_delete_other'))) return;
    try{ await window.__db.doc('profiles/'+state.mentorId).delete(); toast(T('toast_profile_deleted')); nav('browse'); }
    catch(err){ console.error('admin delete failed:', err); toast(T('toast_delete_fail')); }
  });

  const bookCancel = document.getElementById('book-cancel');
  if(bookCancel) bookCancel.addEventListener('click', ()=>{ state.bookingOpen = false; state.selectedSlot = null; render(); });

  if(state.view==='mentor' && state.bookingOpen && state.mentorId) loadBusy(state.mentorId);
  const bmsg = document.getElementById('book-message'); if(bmsg) bmsg.addEventListener('input', ()=>{ state.bookMsg = bmsg.value; });
  document.querySelectorAll('[data-cal-week]').forEach(b=>b.addEventListener('click', ()=>{ state.calWeek = +b.getAttribute('data-cal-week'); state.calDay = null; render(); }));
  document.querySelectorAll('[data-cal-day]').forEach(b=>b.addEventListener('click', ()=>{ state.calDay = b.getAttribute('data-cal-day'); render(); }));
  document.querySelectorAll('.cal-slot').forEach(b=>b.addEventListener('click', ()=>{ state.selectedSlot = { date:b.getAttribute('data-date'), time:b.getAttribute('data-time') }; state.calDay = state.selectedSlot.date; render(); }));
  document.querySelectorAll('.slot-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.selectedSlot = { date: btn.getAttribute('data-date'), time: btn.getAttribute('data-time') };
      render();
    });
  });

  const bookSubmit = document.getElementById('book-submit');
  if(bookSubmit) bookSubmit.addEventListener('click', async ()=>{
    if(!state.selectedSlot || !state.selectedSlot.time){ toast(T('toast_pick_datetime')); return; }
    const mtzB = mentorTz(state.mentorId);
    const instB = state.selectedSlot.local ? zonedToUtc(state.selectedSlot.date, state.selectedSlot.time, MY_TZ) : zonedToUtc(state.selectedSlot.date, state.selectedSlot.time, mtzB);
    const { date, time } = utcToZoned(instB, mtzB);
    if(instB.getTime() < Date.now()){ toast(T('cal_past'), 5000); return; }
    if(isBusy(busyFor(state.mentorId), date, time)){ toast(T('cal_clash'), 5000); return; }
    const messageEl = document.getElementById('book-message');
    const message = messageEl ? messageEl.value : '';
    const reqId = 'req_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const pk = getPackages().find(x=>x.key===(state.selectedPkg||'single')) || getPackages()[0];
    const amountCents = Math.round(pkgPriceFor(pk, cache.profiles[state.mentorId])*100);
    try{
      await insertSafe('requests', { id: reqId, mentorId: state.mentorId, clientId: uid, message, date, time, startsAt: instB.toISOString(), tz: mtzB, status:'pending', createdAt: Date.now(), amountCents, packageKey: pk.key, paid:false });
      notify('request_new', reqId);
      toast(T('toast_request_sent'));
      state.bookMsg = ''; cache.busyLoaded[state.mentorId] = false;
      state.bookingOpen = false;
      state.selectedSlot = null;
      loadRequests(); render();
    }catch(err){
      console.error('booking failed:', err);
      const m = (err && err.message) || '';
      if(/duplicate key|one_active_booking/i.test(m)){ toast(T('cal_taken'), 6000); cache.busyLoaded[state.mentorId] = false; state.selectedSlot = null; loadBusy(state.mentorId); render(); return; }
      toast(T(/row-level security/i.test(m) ? 'toast_request_rls' : 'toast_request_fail') + (m ? ' — ' + m : ''), 9000);
    }
  });

  document.querySelectorAll('#star-input span').forEach(s=>{
    s.addEventListener('click', ()=>{ state.ratingDraft = parseInt(s.getAttribute('data-star')); render(); });
  });

  const reviewForm = document.getElementById('review-form');
  if(reviewForm) reviewForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const text = new FormData(reviewForm).get('text');
    const rid = 'rev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    try{
      await window.__db.doc('reviews/'+rid).set({ mentorId: state.mentorId, clientId: uid, rating: state.ratingDraft, text, createdAt: Date.now() });
      toast(T('toast_review_posted'));
      state.ratingDraft = 5;
      loadReviews(state.mentorId);
    }catch(err){ toast(T('toast_review_fail')); }
  });

  const saveBtn = document.getElementById('save-profile');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const patch = {
      name: document.getElementById('edit-name').value,
      profession: document.getElementById('edit-profession').value,
      bio: document.getElementById('edit-bio').value,
      linkedin: (()=>{ let v=(document.getElementById('edit-linkedin').value||'').trim(); if(v && !/^https?:\/\//i.test(v)) v='https://'+v; return v; })(),
    };
    const tzEl = document.getElementById('edit-timezone');
    if(tzEl) patch.timezone = tzEl.value;
    const skillsEl = document.getElementById('edit-skills');
    if(skillsEl) patch.skills = skillsEl.value.split(',').map(s=>s.trim()).filter(Boolean);
    const companyEl = document.getElementById('edit-company');
    if(companyEl){ patch.company = companyEl.value.trim(); patch.headline = patch.company ? `${patch.profession} ${T('at_word')} ${patch.company}` : patch.profession; }
    const degEl = document.getElementById('edit-degree'), uniEl = document.getElementById('edit-university');
    if(degEl && uniEl){ patch.degree = degEl.value.trim(); patch.university = uniEl.value.trim(); patch.education = [patch.degree, patch.university].filter(Boolean).join(', '); }
    const certEl = document.getElementById('edit-certifications');
    if(certEl) patch.certifications = splitList(certEl.value);
    const fmtWrap = document.getElementById('edit-formats-wrap');
    if(fmtWrap) patch.formats = checkedVals(fmtWrap, 'formats');
    const goalsWrap = document.getElementById('edit-goals-wrap');
    if(goalsWrap) patch.goals = checkedVals(goalsWrap, 'goals');
    const stageEl = document.getElementById('edit-stage');
    if(stageEl) patch.careerStage = stageEl.value;
    const cjEl = document.getElementById('edit-current-job');
    if(cjEl) patch.currentProfession = readCurrentJob(cjEl);
    const tfEl = document.getElementById('edit-target-field');
    if(tfEl) patch.targetField = tfEl.value.trim();
    const srEl = document.getElementById('edit-session-rate');
    if(srEl) patch.sessionRate = Math.max(minRate(), Number(srEl.value)||minRate());
    const expEl = document.getElementById('edit-experience');
    if(expEl) patch.experience = expEl.value;
    const langEl = document.getElementById('edit-languages');
    if(langEl) patch.languages = langEl.value.split(',').map(s=>s.trim()).filter(Boolean);
    const rateEl = document.getElementById('edit-rate');
    if(rateEl) patch.rate = rateEl.value;
    const priceEl = document.getElementById('edit-price-usd');
    if(priceEl) patch.priceUsd = priceEl.value==='' ? null : Math.max(0, Number(priceEl.value)||0);
    const availChecks = document.querySelectorAll('.avail-check');
    if(availChecks.length) patch.availability = Array.from(availChecks).filter(c=>c.checked).map(c=>c.getAttribute('data-slotkey'));
    try{ await saveProfileSafe(patch, 'update'); myProfile = Object.assign({}, myProfile, patch); toast(T('toast_saved')); render(); }
    catch(err){
      console.error('profile save failed:', err);
      toast(T('toast_save_fail'));
    }
  });

  const deleteMyBtn = document.getElementById('delete-my-profile');
  if(deleteMyBtn) deleteMyBtn.addEventListener('click', async ()=>{
    if(!confirm(T('confirm_delete_profile'))) return;
    deleteMyBtn.disabled = true;
    try{
      const { data } = await sb.auth.getSession(); const tok = data && data.session && data.session.access_token;
      const r = await fetch('/api/agents', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+(tok||'') }, body: JSON.stringify({ task:'delete_account' }) });
      const j = await r.json().catch(()=>({}));
      if(r.status===403 && j.error==='admin'){ toast(T('toast_delete_admin'), 7000); deleteMyBtn.disabled = false; return; }
      if(!r.ok) throw new Error(j.detail || j.error || ('HTTP '+r.status));
      toast(T('toast_profile_deleted'));
      try{ await sb.auth.signOut(); }catch(e){}
      uid = null; userEmail = null; myProfile = null;
      state.view = 'home'; render();
    }catch(err){
      console.error('profile delete failed:', err);
      toast(T('toast_delete_fail'));
      deleteMyBtn.disabled = false;
    }
  });

  const reqErr = err=>{ console.error(err); toast(T('toast_update_fail') + ' — ' + ((err && err.message) || ''), 8000); };
  document.querySelectorAll('[data-req]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true; const to = btn.getAttribute('data-status');
      try{ await updateReq(btn.getAttribute('data-req'), { status: to }); toast(T(to==='accepted'?'toast_accepted':'toast_declined')); render(); notify('request_'+to, btn.getAttribute('data-req')); }
      catch(err){ btn.disabled = false; reqErr(err); }
    });
  });
  document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); const id=b.getAttribute('data-menu'); state.reqMenu = state.reqMenu===id ? null : id; render(); }));
  document.querySelectorAll('.req-menu').forEach(m=>m.addEventListener('click', e=>e.stopPropagation()));
  document.querySelectorAll('[data-edit-time]').forEach(b=>b.addEventListener('click', ()=>{ state.reqEdit = b.getAttribute('data-edit-time') || null; state.reqMenu = null; render(); }));
  document.querySelectorAll('[data-save-time]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-save-time'), date = document.getElementById('re-date').value, time = document.getElementById('re-time').value;
    if(!date || !time){ toast(T('toast_pick_datetime')); return; }
    b.disabled = true;
    const rr = cache.requests.find(x=>x.id===id) || {};
    const inst = zonedToUtc(date, time, MY_TZ), mtzE = rr.tz || mentorTz(rr.mentorId), wall = utcToZoned(inst, mtzE);
    if(inst.getTime() < Date.now()){ toast(T('cal_past'), 5000); b.disabled = false; return; }
    try{ await updateReq(id, { date: wall.date, time: wall.time, startsAt: inst.toISOString(), tz: mtzE, remindedAt: null }); state.reqEdit = null; toast(T('mg_time_saved')); render();
      postNote(id, T('mg_time_msg').replace('{d}', fmtLocalDay(inst)).replace('{t}', fmtLocalTime(inst))); notify('time_changed', id); }
    catch(err){ b.disabled = false; reqErr(err); }
  }));
  document.querySelectorAll('[data-set-status]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm(T('mg_cancel_confirm'))) return;
    const id = b.getAttribute('data-set-status');
    try{ await updateReq(id, { status: b.getAttribute('data-to') }); state.reqMenu = null; toast(T('mg_cancelled')); render(); postNote(id, T('mg_cancel_msg')); notify('request_cancelled', id); }
    catch(err){ reqErr(err); }
  }));
  document.querySelectorAll('[data-hide]').forEach(b=>b.addEventListener('click', ()=>{ state.reqMenu = null; removeReqs([b.getAttribute('data-hide')]); }));
  document.querySelectorAll('[data-del-req]').forEach(b=>b.addEventListener('click', ()=>{ removeReqs([b.getAttribute('data-del-req')]); toast(T('past_removed')); }));
  document.querySelectorAll('[data-clear-past]').forEach(b=>b.addEventListener('click', ()=>{ if(!confirm(T('past_clear_q'))) return; removeReqs(b.getAttribute('data-clear-past').split(',').filter(Boolean)); toast(T('past_removed')); }));
  const unh = document.getElementById('unhide-reqs'); if(unh) unh.addEventListener('click', ()=>{ try{ localStorage.removeItem('workar_hidden_'+uid); }catch(e){} render(); });

  if(state.view==='dashboard' && uid && myProfile && !myProfile.timezone && !state.tzSaved){ state.tzSaved = true; saveProfileSafe({ timezone: MY_TZ }, 'update').then(()=>{ myProfile.timezone = MY_TZ; }).catch(()=>{}); }
  document.querySelectorAll('[data-chat]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.getAttribute('data-chat');
    state.chatOpen = state.chatOpen===id ? null : id; state.chatDraft = '';
    if(state.chatOpen){ markChatSeen(id); state.chatFocus = true; loadMsgs(); }
    render();
  }));
  const chatIn = document.getElementById('rc-input');
  if(chatIn){
    const fit = ()=>{ chatIn.style.height='auto'; chatIn.style.height = Math.min(140, chatIn.scrollHeight)+'px'; };
    chatIn.addEventListener('input', ()=>{ state.chatDraft = chatIn.value; fit(); });
    chatIn.addEventListener('focus', ()=>{ state.chatFocus = true; });
    chatIn.addEventListener('blur', ()=>{ state.chatFocus = false; });
    chatIn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); state.chatFocus = true; sendMsg(state.chatOpen, chatIn.value); } });
    fit();
    if(state.chatFocus){ chatIn.focus(); const n = chatIn.value.length; chatIn.setSelectionRange(n,n); }
    const cl = document.getElementById('rc-list'); if(cl) cl.scrollTop = cl.scrollHeight;
  }
  const chatSend = document.getElementById('rc-send');
  if(chatSend) chatSend.addEventListener('click', ()=>{ state.chatFocus = true; sendMsg(chatSend.getAttribute('data-req-id'), (document.getElementById('rc-input')||{}).value); });
  document.querySelectorAll('.rc-q').forEach(b=>b.addEventListener('click', ()=>{
    state.chatDraft = (state.chatDraft ? state.chatDraft.trim()+' ' : '') + b.getAttribute('data-q'); state.chatFocus = true; render();
  }));

  document.querySelectorAll('[data-sess]').forEach(btn=>{

async function pushAndRespond(userText){

      state.chatMsgs.pop(); // A sign-in redirect is not a coaching failure or an AI reply.

      state.chatMsgs.pop(); // don't leave the un-answered user message hanging in the log

      state.chatMsgs.push({role:'ai', content: res.text});

/* ---------- Voice: browser-native speech-to-text (mic) and text-to-speech (read aloud) ---------- */
let __recognizer = null;
function speechSupported(){

function mdLite(text){
  return esc(text||'')
    .replace(/^\s*-{3,}\s*$/gm, '<hr class="md-hr">')
    .replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?]|$)/gm, '$1<i>$2</i>')
    .replace(/^\s*[-•]\s+/gm, '• ');
}
function cleanForSpeech(text){
  return (text||'')
    .replace(/^#{1,6}\s.*$/gm, '')       // drop whole heading lines (e.g. "# Mock Interview...")
    .replace(/\**\s*\b(quick note|note|feedback|question\s*\d*|next question)\s*\**\s*:\s*\**/gi, '')  // spoken labels like "Quick note:" / "Question 3:"

    .replace(/^\s*-{2,}\s*$/gm, '')      // drop divider lines (---)
    .replace(/\*\*(.*?)\*\*/g, '$1')     // bold -> plain
    .replace(/\*(.*?)\*/g, '$1')         // italic -> plain
    .replace(/^[-•]\s*/gm, '')           // bullet markers
    .replace(/\n{2,}/g, '\n')            // collapse extra blank lines left behind
    .trim();
}
let __voicesCache = [];
function refreshVoices(){ __voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickVoice(lang){
  const voices = __voicesCache.length ? __voicesCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  const wantFa = lang.startsWith('fa');
  const langMatches = voices.filter(v => wantFa ? v.lang.toLowerCase().startsWith('fa') : v.lang.toLowerCase().startsWith('en'));
  const pool = langMatches.length ? langMatches : voices;
  if(!pool.length) return null;
  const femaleNames = /female|zira|samantha|susan|victoria|karen|moira|tessa|joanna|salli|kimberly|amy|emma|ava|jenny|aria|nicole|olivia|sonia|natasha|shirin|dorsa/i;
  if(!wantFa){
    // American English only (no UK/AU/IN accents), best-sounding first
    const us = voices.filter(v => /^en[-_]us/i.test(v.lang));
    const rank = [/aria.*(natural|online)/i, /jenny.*(natural|online)/i, /ava.*(natural|online)/i, /(natural|neural|online)/i, /premium/i, /enhanced/i, /google us english/i, /samantha/i, /zira/i];
    for(const r of rank){ const v = us.find(x => r.test(x.name)); if(v) return v; }
    if(us.length) return us[0];
  }
  // Prefer high-quality "Natural"/"Neural"/"Online" voices (e.g. Edge's "Microsoft Aria Online (Natural)") — these sound far less robotic than legacy voices
  const naturalFemale = pool.find(v => /natural|neural|online/i.test(v.name) && femaleNames.test(v.name));
  if(naturalFemale) return naturalFemale;
  const anyNatural = pool.find(v => /natural|neural|online/i.test(v.name));
  if(anyNatural) return anyNatural;
  const female = pool.find(v => femaleNames.test(v.name));
  if(female) return female;
  const notMale = pool.find(v => !/male|david|mark|guy|daniel|george|matthew|brian|christopher/i.test(v.name));
  return notMale || pool[0];
}
// Natural voice (OpenAI via /api/tts); falls back to the browser voice if it isn't set up.
let __ttsAudio = null, __ttsOff = false;
// Phones (especially iPhone) only allow audio that starts from a tap. We "unlock" one audio player on the
// first tap and reuse it for every answer, so the natural voice can play when the AI reply arrives later.
const __ttsEl = (typeof Audio!=='undefined') ? new Audio() : null;
const __SILENT = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
let __ttsUnlocked = false;
function unlockAudio(){
  if(__ttsUnlocked || !__ttsEl) return;
  try{ __ttsEl.src = __SILENT; const pr = __ttsEl.play(); if(pr && pr.then) pr.then(()=>{ __ttsUnlocked = true; }).catch(()=>{}); }catch(e){}

}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ if(state.voiceMode || state.coachMode==='interview') unlockAudio(); }, { passive:true }));

function splitSpeech(t){
  const parts = String(t).match(/[^.!?؟\n]+[.!?؟]*\s*/g) || [String(t)];
  const out = []; let cur = '';
  for(const p of parts){ if(cur && (cur + p).length > 240){ out.push(cur.trim()); cur = p; } else cur += p; }
  if(cur.trim()) out.push(cur.trim());
  return out.length ? out : [String(t)];
}
async function ttsFetch(text, tok){
  const r = await fetch('/api/tts', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body: JSON.stringify({ text, lang: state.lang==='fa'?'fa':'en' }) });
  if(!r.ok){ const e = new Error('tts ' + r.status); e.status = r.status; try{ e.detail = await r.text(); }catch(x){} throw e; }

// Speaks in short pieces: the first sentence starts playing within a second or two while the rest is prepared.
async function speakText(text){
  const clean = cleanForSpeech(text);
  if(!clean) return;
  stopSpeaking();
  const gen = ++__speakGen;
  if(!__ttsOff && sb){
    try{
      const { data } = await sb.auth.getSession();

      if(!tok){ state.voiceDetail = 'Not signed in on this device.'; setEngine('signin'); }

            setEngine(err.status===501 ? 'nokey' : err.status===404 ? 'nofile' : err.status===401 ? 'signin' : 'error');
            if(err.detail && /quota|billing|credit/i.test(err.detail)) toast(T('ve_credit'), 7000);
            break;
          }
          if(gen!==__speakGen){ URL.revokeObjectURL(url); return; }
          if(i+1 < chunks.length){ next = ttsFetch(chunks[i+1], tok); next.catch(()=>{}); }

          try{ await a.play(); }
          catch(playErr){ console.warn('phone blocked audio', playErr); state.voiceDetail = 'Audio play blocked: ' + String(playErr && (playErr.name || playErr.message) || playErr).slice(0,120); setEngine('blocked'); toast(T('voice_tap_replay'), 4000); URL.revokeObjectURL(url); return; }

        }

function setEngine(k){ if(state.voiceEngine!==k){ state.voiceEngine = k; if(state.view==='coach') render(); } }
function speakBrowser(clean){

function startListening(){

const __subscribed = { reviews:{}, requests:false };
