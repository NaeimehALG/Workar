}

function coachView(){
  const modes = [['resume',T('mode_resume')], ['career',T('mode_career')], ['interview',T('mode_interview')]];
  const showRolePrompt = state.coachMode==='interview' && !state.interviewStarted;
  const credits = (myProfile && myProfile.aiCredits!=null) ? myProfile.aiCredits : null;
  const isOut = state.outOfCredits || (credits!=null && credits<=0);
  const creditsLine = credits==null ? '' : (credits===1 ? T('ai_credits_left_1') : T('ai_credits_left').replace('{n}', credits));
  const voiceControls = (state.coachMode==='interview' && state.interviewStarted) ? `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
        <input type="checkbox" id="voice-mode-toggle" ${state.voiceMode?'checked':''}> ${esc(T('voice_mode'))}
      </label>
      ${speechSupported() ? `<button class="btn btn-sm btn-outline" id="mic-btn" type="button">${state.listening ? esc(T('listening')) : esc(T('mic_start'))}</button>` : `<span class="muted" style="font-size:12px;">${esc(T('voice_not_supported'))}</span>`}
    </div>` : '';
  return `
  <div class="section-head"><h2>${esc(T('coach_title'))}</h2>${creditsLine ? `<span class="muted" style="font-size:12.5px;">${esc(creditsLine)}</span>` : ''}</div>
  <div class="coach-modes">${modes.map(([m,l])=>`<div class="mode-btn ${state.coachMode===m?'active':''}" data-mode="${m}">${esc(l)}</div>`).join('')}</div>
  ${showRolePrompt ? `
  <div class="panel">
    <div class="field"><label>${esc(T('interview_role_lbl'))}</label><input id="interview-role" placeholder="${esc(T('ph_interview_role'))}" value="${esc(state.interviewRole||'')}"></div>
    <button class="btn btn-primary" id="start-interview">${esc(T('start_interview'))}</button>
  </div>` : `
  ${voiceControls}
  <div class="chat">
    <div class="chat-log" id="chat-log">
      ${state.chatMsgs.length ? state.chatMsgs.map((m,i)=>`<div class="msg ${m.role==='user'?'user':'ai'}">${esc(m.content)}${(m.role==='ai' && state.coachMode==='interview' && window.speechSynthesis) ? `<div><button class="btn btn-ghost btn-sm replay-btn" type="button" data-msg-i="${i}" style="padding:2px 8px;margin-top:6px;">${esc(T('replay_audio'))}</button></div>` : ''}</div>`).join('')
        : `<div class="empty" style="border:none;">${state.coachMode==='resume' ? esc(T('empty_resume')) : esc(T('empty_career'))}</div>`}
      ${state.sending ? `<div class="msg ai">${esc(T('thinking'))}</div>` : ''}
    </div>
    ${isOut ? `
    <div class="panel" style="margin-top:0;">
      <p style="margin:0 0 10px;">${esc(T('ai_out_of_credits'))}</p>
      <button class="btn btn-primary" id="buy-ai-credits">${esc(T('buy_ai_credits'))}</button>
    </div>` : `
    <div class="chat-input">
      <textarea id="chat-text" rows="2" placeholder="${state.coachMode==='interview' ? esc(T('ph_chat_interview')) : (state.coachMode==='resume' ? esc(T('ph_chat_resume')) : esc(T('ph_chat_career')))}"></textarea>
      <button class="btn btn-primary" id="chat-send" ${state.sending?'disabled':''}>${esc(T('send'))}</button>
    </div>`}
  </div>${state.coachMode==='interview' ? `<button class="btn btn-ghost btn-sm" id="end-interview" style="margin-top:12px;">${esc(T('restart_interview'))}</button>` : ''}`}`;
}

function wire(){
  document.querySelectorAll('[data-nav]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const view = node.getAttribute('data-nav');
      const params = {};
      if(node.hasAttribute('data-mentor')) { params.mentorId = node.getAttribute('data-mentor'); params.bookingOpen = false; }
      if(node.hasAttribute('data-role')) params.role = node.getAttribute('data-role');
      if(view==='onboard') params.role = node.getAttribute('data-role') || state.role || null;
      nav(view, params);
    });
  });

  const bookSignup = document.getElementById('book-signup');
  if(bookSignup) bookSignup.addEventListener('click', ()=>{
    nav('onboard', { role:'client', returnMentorId: bookSignup.getAttribute('data-mentor-id') });
  });

  const langBtn = document.getElementById('lang-toggle');
  if(langBtn) langBtn.addEventListener('click', ()=>{ state.lang = state.lang==='en' ? 'fa' : 'en'; render(); });

  const signoutBtn = document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click', async ()=>{ await sb.auth.signOut(); });

  document.querySelectorAll('.role-opt').forEach(node=>{
    node.addEventListener('click', ()=>{ state.role = node.getAttribute('data-role'); render(); });
  });

  const form = document.getElementById('onboard-form');
  if(form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    let linkedinVal = (fd.get('linkedin')||'').trim();
    if(linkedinVal && !/^https?:\/\//i.test(linkedinVal)) linkedinVal = 'https://'+linkedinVal;
    const doc = { role: state.role, name: fd.get('name')||'', profession: fd.get('profession')||'', bio: fd.get('bio')||'', linkedin: linkedinVal, aiCredits: 5 };
    doc.skills = (fd.get('skills')||'').split(',').map(s=>s.trim()).filter(Boolean);
    doc.education = (fd.get('education')||'').trim();
    doc.certifications = splitList(fd.get('certifications'));
    doc.formats = checkedVals(form, 'formats');
    if(state.role==='client'){
      doc.goals = checkedVals(form, 'goals');
      doc.careerStage = fd.get('careerStage')||'';
      doc.targetField = (fd.get('targetField')||'').trim();
    }
    if(state.role==='mentor'){
      doc.headline = fd.get('headline')||'';
      doc.experience = fd.get('experience')||'';
      doc.languages = (fd.get('languages')||'').split(',').map(s=>s.trim()).filter(Boolean);
      doc.rate = fd.get('rate')||'';
    }
    try{
      await window.__db.doc('profiles/'+uid).set(doc);
      toast(T('toast_profile_created'));
      if(state.role==='client' && state.returnMentorId){
        const back = state.returnMentorId; state.returnMentorId = null;
        nav('mentor', { mentorId: back, bookingOpen: true });
      } else {
        nav(state.role==='mentor' ? 'dashboard' : 'browse');
      }
    }catch(err){
      console.error('profile create failed:', err);
      toast(T('toast_save_fail'));
    }
  });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      state.query = searchInput.value; render();
      const si = document.getElementById('search-input');
      si.focus(); si.selectionStart = si.value.length;
    });
  }

  const reqBtn = document.getElementById('request-btn');
  if(reqBtn) reqBtn.addEventListener('click', ()=>{ state.bookingOpen = true; state.selectedSlot = null; render(); });
  const bd = document.getElementById('book-date'), bt = document.getElementById('book-time');
  const syncOwn = ()=>{
    const d = bd && bd.value, t = bt && bt.value;
    state.selectedSlot = (d && t) ? { date:d, time:t } : null;
    const sb2 = document.getElementById('book-submit'); if(sb2) sb2.disabled = !state.selectedSlot;
  };
  if(bd) bd.addEventListener('change', syncOwn);
  if(bt) bt.addEventListener('change', syncOwn);
  document.querySelectorAll('input[name="pkg"]').forEach(r=>r.addEventListener('change', ()=>{ state.selectedPkg = r.value; render(); }));
  document.querySelectorAll('.card-book').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    nav('mentor', { mentorId: btn.getAttribute('data-book'), bookingOpen: !!myProfile, selectedSlot: null });
  }));

  const adminSaveBtn = document.getElementById('admin-save-profile');
  if(adminSaveBtn) adminSaveBtn.addEventListener('click', async ()=>{
    const patch = {
      name: document.getElementById('admin-edit-name').value,
      headline: document.getElementById('admin-edit-headline').value,
      bio: document.getElementById('admin-edit-bio').value,
    };
    try{ await window.__db.doc('profiles/'+state.mentorId).update(patch); toast(T('toast_saved')); }
    catch(err){ console.error('admin edit failed:', err); toast(T('toast_save_fail')); }
  });

  const adminDeleteBtn = document.getElementById('admin-delete-profile');
  if(adminDeleteBtn) adminDeleteBtn.addEventListener('click', async ()=>{
    if(!confirm(T('confirm_delete_other'))) return;
    try{ await window.__db.doc('profiles/'+state.mentorId).delete(); toast(T('toast_profile_deleted')); nav('browse'); }
    catch(err){ console.error('admin delete failed:', err); toast(T('toast_delete_fail')); }
  });

  const bookCancel = document.getElementById('book-cancel');
  if(bookCancel) bookCancel.addEventListener('click', ()=>{ state.bookingOpen = false; state.selectedSlot = null; render(); });

  document.querySelectorAll('.slot-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.selectedSlot = { date: btn.getAttribute('data-date'), time: btn.getAttribute('data-time') };
      render();
    });
  });

  const bookSubmit = document.getElementById('book-submit');
  if(bookSubmit) bookSubmit.addEventListener('click', async ()=>{
    if(!state.selectedSlot){ toast(T('toast_pick_datetime')); return; }
    const { date, time } = state.selectedSlot;
    const messageEl = document.getElementById('book-message');
    const message = messageEl ? messageEl.value : '';
    const reqId = 'req_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const pk = getPackages().find(x=>x.key===(state.selectedPkg||'single')) || getPackages()[0];
    const amountCents = Math.round(Number(pk.price)*100);
    try{
      await window.__db.doc('requests/'+reqId).set({ mentorId: state.mentorId, clientId: uid, message, date, time, status:'pending', createdAt: Date.now(), amountCents, packageKey: pk.key, paid:false, stripeSessionId:null });
      toast(T('toast_request_sent'));
      state.bookingOpen = false;
      state.selectedSlot = null;
      loadRequests(); render();
    }catch(err){ toast(T('toast_request_fail')); }
  });

  document.querySelectorAll('#star-input span').forEach(s=>{
    s.addEventListener('click', ()=>{ state.ratingDraft = parseInt(s.getAttribute('data-star')); render(); });
  });

  const reviewForm = document.getElementById('review-form');
  if(reviewForm) reviewForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const text = new FormData(reviewForm).get('text');
    const rid = 'rev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    try{
      await window.__db.doc('reviews/'+rid).set({ mentorId: state.mentorId, clientId: uid, rating: state.ratingDraft, text, createdAt: Date.now() });
      toast(T('toast_review_posted'));
      state.ratingDraft = 5;
      loadReviews(state.mentorId);
    }catch(err){ toast(T('toast_review_fail')); }
  });

  const saveBtn = document.getElementById('save-profile');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const patch = {
      name: document.getElementById('edit-name').value,
      profession: document.getElementById('edit-profession').value,
      bio: document.getElementById('edit-bio').value,
      linkedin: (()=>{ let v=(document.getElementById('edit-linkedin').value||'').trim(); if(v && !/^https?:\/\//i.test(v)) v='https://'+v; return v; })(),
    };
    const skillsEl = document.getElementById('edit-skills');
    if(skillsEl) patch.skills = skillsEl.value.split(',').map(s=>s.trim()).filter(Boolean);
    const headlineEl = document.getElementById('edit-headline');
    if(headlineEl) patch.headline = headlineEl.value;
    const eduEl = document.getElementById('edit-education');
    if(eduEl) patch.education = eduEl.value.trim();
    const certEl = document.getElementById('edit-certifications');
    if(certEl) patch.certifications = splitList(certEl.value);
    const fmtWrap = document.getElementById('edit-formats-wrap');
    if(fmtWrap) patch.formats = checkedVals(fmtWrap, 'formats');
    const goalsWrap = document.getElementById('edit-goals-wrap');
    if(goalsWrap) patch.goals = checkedVals(goalsWrap, 'goals');
    const stageEl = document.getElementById('edit-stage');
    if(stageEl) patch.careerStage = stageEl.value;
    const tfEl = document.getElementById('edit-target-field');
    if(tfEl) patch.targetField = tfEl.value.trim();
    const expEl = document.getElementById('edit-experience');
    if(expEl) patch.experience = expEl.value;
    const langEl = document.getElementById('edit-languages');
    if(langEl) patch.languages = langEl.value.split(',').map(s=>s.trim()).filter(Boolean);
    const rateEl = document.getElementById('edit-rate');
    if(rateEl) patch.rate = rateEl.value;
    const priceEl = document.getElementById('edit-price-usd');
    if(priceEl) patch.priceUsd = priceEl.value==='' ? null : Math.max(0, Number(priceEl.value)||0);
    const availChecks = document.querySelectorAll('.avail-check');
    if(availChecks.length) patch.availability = Array.from(availChecks).filter(c=>c.checked).map(c=>c.getAttribute('data-slotkey'));
    try{ await window.__db.doc('profiles/'+uid).update(patch); toast(T('toast_saved')); }
    catch(err){
      console.error('profile save failed:', err);
      toast(T('toast_save_fail'));
    }
  });

  const deleteMyBtn = document.getElementById('delete-my-profile');
  if(deleteMyBtn) deleteMyBtn.addEventListener('click', async ()=>{
    if(!confirm(T('confirm_delete_profile'))) return;
    try{
      await window.__db.doc('profiles/'+uid).delete();
      toast(T('toast_profile_deleted'));
      state.view = 'home';
    }catch(err){
      console.error('profile delete failed:', err);
      toast(T('toast_delete_fail'));
    }
  });

  document.querySelectorAll('[data-req]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{ await window.__db.doc('requests/'+btn.getAttribute('data-req')).update({status: btn.getAttribute('data-status')}); loadRequests(); }
      catch(err){ toast(T('toast_update_fail')); }
    });
  });

  document.querySelectorAll('[data-pay]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const reqId = btn.getAttribute('data-pay');
      const amountCents = parseInt(btn.getAttribute('data-amount'), 10);
      const mentorId = btn.getAttribute('data-mentor');
      const mentorName = nameOf(mentorId);
      const cleanUrl = location.origin + location.pathname;
      try{
        const res = await fetch('/api/create-checkout', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({
            requestId: reqId,
            amountCents,
            mentorName,
            successUrl: cleanUrl + '?paid=' + encodeURIComponent(reqId),
            cancelUrl: cleanUrl + '?payment=cancelled'
          })
        });
        const data = await res.json();
        if(!res.ok || !data.url) throw new Error(data.error || 'checkout-failed');
        window.location.href = data.url;
      }catch(err){ toast(T('toast_payment_fail')); btn.disabled = false; }
    });
  });

  document.querySelectorAll('[data-call]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const reqId = btn.getAttribute('data-call');
      const voiceOnly = btn.getAttribute('data-mode')==='voice';
      const displayName = (myProfile && myProfile.name) ? myProfile.name : 'Workar user';
      let cfg = '#config.prejoinPageEnabled=false&userInfo.displayName=' + encodeURIComponent('"'+displayName+'"');
      if(voiceOnly) cfg += '&config.startAudioOnly=true&config.startWithVideoMuted=true';
      window.open('https://meet.jit.si/Workar-Session-' + encodeURIComponent(reqId) + cfg, '_blank', 'noopener');
    });
  });

  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.coachMode = btn.getAttribute('data-mode'); state.chatMsgs=[]; state.interviewStarted=false; state.outOfCredits=false; render(); });
  });

  const voiceToggle = document.getElementById('voice-mode-toggle');
  if(voiceToggle) voiceToggle.addEventListener('change', ()=>{ state.voiceMode = voiceToggle.checked; if(!state.voiceMode) window.speechSynthesis && window.speechSynthesis.cancel(); });

  const micBtn = document.getElementById('mic-btn');
  if(micBtn) micBtn.addEventListener('click', ()=>{ state.listening ? stopListening() : startListening(); });

  const buyAiBtn = document.getElementById('buy-ai-credits');
  if(buyAiBtn) buyAiBtn.addEventListener('click', async ()=>{
    buyAiBtn.disabled = true;
    const cleanUrl = location.origin + location.pathname;
    try{
      const res = await fetch('/api/create-checkout', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          kind: 'ai_credits',
          userId: uid,
          successUrl: cleanUrl + '?aiPaid=1',
          cancelUrl: cleanUrl + '?payment=cancelled'
        })
      });
      const data = await res.json();
      if(!res.ok || !data.url) throw new Error(data.error || 'checkout-failed');
      window.location.href = data.url;
    }catch(err){ toast(T('toast_payment_fail')); buyAiBtn.disabled = false; }
  });

  const startInt = document.getElementById('start-interview');
  if(startInt) startInt.addEventListener('click', async ()=>{
    const roleVal = document.getElementById('interview-role').value.trim();
    state.interviewRole = roleVal || 'the role';
    state.interviewStarted = true;
    state.chatMsgs = [];
    render();
    await pushAndRespond('Please begin the mock interview.');
  });
  const endInt = document.getElementById('end-interview');
  if(endInt) endInt.addEventListener('click', ()=>{ state.interviewStarted = false; state.chatMsgs = []; state.interviewRole=''; render(); });

  const matchBtn = document.getElementById('match-btn');
  if(matchBtn) matchBtn.addEventListener('click', async ()=>{
    const val = document.getElementById('match-input').value.trim();
    if(!val) return;
    const mentorList = Object.entries(cache.profiles).map(([id,p])=>({ id, profession:p.profession||'', headline:p.headline||'', bio:(p.bio||'').slice(0,300), skills:p.skills||[] }));
    if(!mentorList.length){ toast(T('toast_no_mentors')); return; }
    state.matchQuery = val; state.matching = true; state.matchResults = null; render();
    try{
      const prompt = `A person is looking for a career mentor. Their situation:\n"""${val}"""\n\nAvailable mentors as JSON:\n${JSON.stringify(mentorList)}\n\nPick up to 3 mentors who best fit this person's situation. Respond ONLY with a JSON array like [{"id":"...","reason":"one short sentence on why this mentor fits, in the same language as the person's situation"}], best fit first. Return an empty array if none fit well.`;
      const result = await sampleMatch(prompt, mentorList, val);
      state.matchResults = Array.isArray(result) ? result.filter(r=>r && cache.profiles[r.id]) : [];
    }catch(err){ toast(T('toast_match_fail')); state.matchResults = []; }
    state.matching = false; render();
  });

  const sendBtn = document.getElementById('chat-send');
  if(sendBtn) sendBtn.addEventListener('click', sendChat);
  const chatText = document.getElementById('chat-text');
  if(chatText) chatText.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });

  document.querySelectorAll('.replay-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-msg-i'), 10);
      const msg = state.chatMsgs[i];
      if(msg) speakText(msg.content);
    });
  });
  const log = document.getElementById('chat-log');
  if(log) log.scrollTop = log.scrollHeight;

  if(state.view==='mentor' && state.mentorId) loadReviews(state.mentorId);
  if(state.view==='dashboard') loadRequests();
}

async function pushAndRespond(userText){
  state.chatMsgs.push({role:'user', content:userText});
  state.sending = true; state.outOfCredits = false; render();
  const sysHints = {
    resume: 'You are a direct, encouraging career coach reviewing a resume. Reply in the same language the person writes in. Give specific, actionable feedback: what to cut, what to strengthen, and one concrete rewrite example. Keep it concise.',
    career: 'You are a warm, practical career coach. Reply in the same language the person writes in. Give specific, actionable advice for the career question, grounded in the details given. Keep it concise.',
    interview: `You are conducting a mock interview for the role of "${state.interviewRole||'the target role'}". Reply in the same language the candidate uses. Ask one question at a time. After each answer, briefly note what was strong or missing in a line or two, then ask the next relevant question. If the candidate writes "feedback" or "done", stop asking questions and instead give a structured summary: strengths, areas to improve, and one example of a stronger answer.`
  };
  const sysHint = sysHints[state.coachMode];
  try{
    const turns = state.chatMsgs.map((m,i)=>({ role: m.role==='user' ? 'user' : 'assistant', content: (i===0 && m.role==='user') ? sysHint + '\n\n' + m.content : m.content }));
    const res = await sampleChat(turns);
    if(res.noCredits){
      state.chatMsgs.pop(); // don't leave the un-answered user message hanging in the log
      state.outOfCredits = true;
    } else {
      state.chatMsgs.push({role:'ai', content: res.text});
      if(state.voiceMode && state.coachMode==='interview') speakText(res.text);
    }
  }catch(err){ state.chatMsgs.push({role:'ai', content: T('toast_coach_fail')}); }
  state.sending = false; render();
}
async function sendChat(){
  const box = document.getElementById('chat-text');
  const text = box.value.trim();
  if(!text || state.sending) return;
  box.value=''; await pushAndRespond(text);
}

/* ---------- Voice: browser-native speech-to-text (mic) and text-to-speech (read aloud) ---------- */
let __recognizer = null;
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function cleanForSpeech(text){
  return (text||'')
    .replace(/^#{1,6}\s.*$/gm, '')       // drop whole heading lines (e.g. "# Mock Interview...")
    .replace(/^\s*-{2,}\s*$/gm, '')      // drop divider lines (---)
    .replace(/\*\*(.*?)\*\*/g, '$1')     // bold -> plain
    .replace(/\*(.*?)\*/g, '$1')         // italic -> plain
    .replace(/^[-•]\s*/gm, '')           // bullet markers
    .replace(/\n{2,}/g, '\n')            // collapse extra blank lines left behind
    .trim();
}
let __voicesCache = [];
function refreshVoices(){ __voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickVoice(lang){
  const voices = __voicesCache.length ? __voicesCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  const wantFa = lang.startsWith('fa');
  const langMatches = voices.filter(v => wantFa ? v.lang.toLowerCase().startsWith('fa') : v.lang.toLowerCase().startsWith('en'));
  const pool = langMatches.length ? langMatches : voices;
  if(!pool.length) return null;
  const femaleNames = /female|zira|samantha|susan|victoria|karen|moira|tessa|joanna|salli|kimberly|amy|emma|ava|jenny|aria|nicole|olivia|sonia|natasha|shirin|dorsa/i;
  // Prefer high-quality "Natural"/"Neural"/"Online" voices (e.g. Edge's "Microsoft Aria Online (Natural)") — these sound far less robotic than legacy voices
  const naturalFemale = pool.find(v => /natural|neural|online/i.test(v.name) && femaleNames.test(v.name));
  if(naturalFemale) return naturalFemale;
  const anyNatural = pool.find(v => /natural|neural|online/i.test(v.name));
  if(anyNatural) return anyNatural;
  const female = pool.find(v => femaleNames.test(v.name));
  if(female) return female;
  const notMale = pool.find(v => !/male|david|mark|guy|daniel|george|matthew|brian|christopher/i.test(v.name));
  return notMale || pool[0];
}
function speakText(text){
  if(!window.speechSynthesis) return;
  const clean = cleanForSpeech(text);
  if(!clean) return;
  window.speechSynthesis.cancel(); // don't overlap with a previous utterance
  const langTag = state.lang === 'fa' ? 'fa-IR' : 'en-US';
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = langTag;
  const voice = pickVoice(langTag);
  if(voice) u.voice = voice;
  u.pitch = 1;
  u.rate = 0.93;
  u.onerror = ()=>{ toast(T('voice_speak_fail')); };
  window.speechSynthesis.speak(u);
}
function startListening(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec) { toast(T('voice_not_supported')); return; }
  if(state.listening) return;
  const rec = new Rec();
  __recognizer = rec;
  rec.lang = state.lang === 'fa' ? 'fa-IR' : 'en-US';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  state.listening = true; render();
  let finalText = '';
  rec.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const chunk = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += chunk;
      else interim += chunk;
    }
    const box = document.getElementById('chat-text');
    if(box) box.value = (finalText + interim).trim();
  };
  rec.onerror = (e)=>{
    state.listening = false; render();
    if(e && (e.error==='not-allowed' || e.error==='service-not-allowed')) toast(T('voice_mic_denied'));
  };
  rec.onend = ()=>{
    state.listening = false;
    const t = finalText.trim();
    render();
    if(t) pushAndRespond(t); // pass text directly — the textarea gets wiped by render() above
  };
  rec.start();
}
function stopListening(){
  if(__recognizer) __recognizer.stop();
}

const __subscribed = { reviews:{}, requests:false };
function loadReviews(mentorId){
  if(!window.__db || !mentorId || __subscribed.reviews[mentorId]) return;
  __subscribed.reviews[mentorId] = true;
  window.__db.collection('reviews').where('mentorId','==',mentorId).onSnapshot(async list=>{
    cache.reviews[mentorId] = (list||[]).map(d=>Object.assign({id:d.id}, d.data));
    await resolveNames(cache.reviews[mentorId].map(r=>r.clientId));
    if(state.view==='mentor' && state.mentorId===mentorId) render();
  });
}
function loadRequests(){
  if(!window.__db || !myProfile || __subscribed.requests) return;
  __subscribed.requests = true;
  const field = myProfile.role==='mentor' ? 'mentorId' : 'clientId';
  window.__db.collection('requests').where(field,'==',uid).onSnapshot(async list=>{
    cache.requests = (list||[]).map(d=>Object.assign({id:d.id}, d.data));
    await resolveNames(cache.requests.flatMap(r=>[r.mentorId, r.clientId]));
    if(state.view==='dashboard') render();
  });
}

init();
</script>
