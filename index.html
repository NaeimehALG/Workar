  body{
    background:var(--bg); color:var(--text);
    font-family:'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1040px;margin:0 auto;padding:0 20px 80px;}
  a{color:inherit;}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--border);margin-bottom:32px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:flex-end;gap:8px;cursor:pointer;padding-bottom:2px;}
  .brand img.logo-mark{height:52px;width:auto;display:block;}
  .brand .mark{font-weight:800;font-size:24px;letter-spacing:-.01em;}
  .brand .tag{font-size:12px;color:var(--muted);position:relative;top:7px;}
  .navlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .navlink{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);border:1px solid transparent;}
  .navlink.active{background:var(--surface-2);color:var(--text);border-color:var(--border);}
  .navlink:hover{color:var(--text);}
  .lang-switch{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--accent);border:1px solid var(--border);background:var(--surface-2);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:14.5px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(139,106,76,.3);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;}
  .btn-ghost:hover{color:var(--text);}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}



  /* ---------- PMP Prep ---------- */
  .pp-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px;margin-bottom:26px;}
  @media (max-width:820px){.pp-hero{grid-template-columns:1fr;padding:24px;}}
  .pp-kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .pp-hero h1{font-size:36px;font-weight:800;margin:0 0 10px;line-height:1.2;}
  .pp-hero p{color:var(--muted);margin:0 0 20px;max-width:52ch;}
  .pp-hero-stats{display:flex;gap:28px;flex-wrap:wrap;}
  .pp-hero-stats b{display:block;font-size:26px;font-weight:800;}
  .pp-hero-stats span{font-size:12.5px;color:var(--muted);}
  .pp-hero-modes{display:grid;gap:12px;}
  .pp-mode-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;}
  .pp-mode-ico{grid-row:span 2;font-size:24px;}
  .pp-mode-tile b{font-size:15px;} .pp-mode-tile span{font-size:13px;color:var(--muted);}
  .pp-resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--accent);background:var(--surface-2);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:20px;}
  .pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .pp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s ease;}
  .pp-card:hover{transform:translateY(-2px);}
  .pp-card.is-free{border:2px solid var(--accent);}
  .pp-card.is-draft{opacity:.7;border-style:dashed;}
  .pp-card-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;min-height:24px;}
  .pp-badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid var(--border);}
  .pp-badge.free{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .pp-badge.paid{color:var(--text);background:var(--surface-2);}
  .pp-badge.owned{color:#4E8A5B;border-color:#4E8A5B;}
  .pp-badge.draft{color:#C2773A;border-color:#C2773A;}
  .pp-best{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--muted);}
  .pp-card h3{margin:0 0 6px;font-size:19px;font-weight:800;}
  .pp-card-sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;flex:1;}
  .pp-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:16px;}
  .pp-cta{width:100%;}
  .pp-pick{display:grid;gap:8px;}
  .pp-bundle{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:24px;padding:24px 28px;border-radius:var(--radius-lg);background:var(--accent);color:var(--accent-ink);}
  .pp-bundle .pp-kicker{color:var(--accent-ink);opacity:.85;}
  .pp-bundle h3{margin:0 0 4px;font-size:22px;font-weight:800;}
  .pp-bundle .muted{color:var(--accent-ink);opacity:.85;margin:0;}
  .pp-bundle > div:first-child{flex:1 1 360px;}
  .pp-bundle-buy{text-align:center;flex:0 0 auto;}
  .pp-bundle-buy .btn{background:var(--accent-ink);color:var(--accent);margin-top:8px;}
  .pp-strike{text-decoration:line-through;opacity:.7;font-size:14px;}
  .pp-bundle-price{font-size:34px;font-weight:800;line-height:1.1;}
  .pp-save{font-size:13px;font-weight:700;}
  .pp-history{display:grid;gap:8px;}
  .pp-hrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;}
  .pp-band{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .pp-band.above{background:#E3F0E5;color:#2F6B3D;} .pp-band.target{background:var(--surface-2);color:var(--accent);}
  .pp-band.below{background:#FBEBDD;color:#9A5420;} .pp-band.needs{background:#F8E1DC;color:#9B3322;}
  .pp-disclaimer{font-size:12px;color:var(--muted);text-align:center;margin-top:30px;}
  .pp-busy{position:fixed;inset:0;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:50;color:#fff;font-weight:700;}
  .pp-run{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start;}
  @media (max-width:860px){.pp-run{grid-template-columns:1fr;}}
  .pp-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .pp-progress{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .pp-progress div{height:100%;background:var(--accent);transition:width .3s ease;}
  .pp-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 12px;border-radius:999px;background:var(--surface-2);}
  .pp-timer.warn{background:#F8E1DC;color:#9B3322;}
  .pp-live{font-weight:700;font-size:14px;}
  .pp-qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow);}
  .pp-qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .pp-qnum{font-weight:800;color:var(--accent);font-size:14px;}
  .pp-flag{margin-inline-start:auto;background:none;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .pp-flag.on{color:#C2773A;border-color:#C2773A;font-weight:700;}
  .pp-prompt{font-size:17px;line-height:1.6;margin:0 0 14px;color:var(--text);}
  .pp-multi{font-size:13px;font-weight:700;color:#C2773A;margin:-6px 0 12px;}
  .pp-opts{display:grid;gap:10px;}
  .pp-opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;}
  .pp-opt:hover:not([disabled]){border-color:var(--accent-2);}
  .pp-opt.sel{border-color:var(--accent);background:var(--surface-2);}
  .pp-opt.correct{border-color:#4E8A5B;background:#E3F0E5;color:#1F4A29;}
  .pp-opt.wrong{border-color:#B3412C;background:#F8E1DC;color:#6E2416;}
  .pp-opt.dim{opacity:.6;}
  .pp-opt[disabled]{cursor:default;}
  .pp-letter{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;opacity:.8;}
  .pp-otext{flex:1;}
  .pp-mark{font-weight:800;font-size:16px;}
  .pp-explain{margin-top:16px;padding:14px 16px;border-radius:var(--radius-md);border-inline-start:4px solid;animation:ppIn .25s ease;}
  .pp-explain.ok{background:#EEF6EF;border-color:#4E8A5B;color:#1F4A29;}
  .pp-explain.no{background:#FBEFEC;border-color:#B3412C;color:#5C1E13;}
  .pp-explain b{display:block;margin-bottom:4px;}
  .pp-explain p{margin:0;line-height:1.6;font-size:14.5px;}
  @keyframes ppIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .pp-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .pp-keys{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;}
  @media (max-width:600px){.pp-keys{display:none;}}
  .pp-navgrid{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:sticky;top:14px;}
  .pp-navhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px;}
  .pp-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .pp-dot{position:relative;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .pp-dot.ans{background:var(--surface-2);border-color:var(--accent-2);}
  .pp-dot.ok{background:#E3F0E5;border-color:#4E8A5B;color:#1F4A29;}
  .pp-dot.no{background:#F8E1DC;border-color:#B3412C;color:#6E2416;}
  .pp-dot.cur{outline:2px solid var(--accent);outline-offset:1px;}
  .pp-dot.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#C2773A;}
  .pp-navgrid .btn{width:100%;}
  .pp-results{max-width:860px;margin:0 auto;}
  .pp-score{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow);}
  .pp-ring-num{font-size:30px;font-weight:800;fill:var(--text);}
  .pp-ring-arc{animation:ppRing 1.1s cubic-bezier(.2,.7,.2,1);}
  @keyframes ppRing{from{stroke-dashoffset:var(--c);}}
  .pp-tip{margin:10px 0 0;font-weight:700;color:var(--accent);}
  .pp-domains{display:grid;gap:14px;margin:22px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;}
  .pp-dom-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .pp-bar{height:10px;background:var(--surface-2);border-radius:10px;overflow:hidden;}
  .pp-bar div{height:100%;border-radius:10px;animation:ppBar 1s ease;}
  @keyframes ppBar{from{width:0 !important;}}
  .pp-res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
  .pp-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .pp-tab{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .pp-tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .pp-rev{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid;border-radius:var(--radius-md);padding:18px;margin-bottom:12px;}
  .pp-rev.ok{border-inline-start-color:#4E8A5B;} .pp-rev.no{border-inline-start-color:#B3412C;}
  .pp-rev-opt{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:14px;margin-bottom:4px;}
  .pp-rev-opt .pp-letter{flex-basis:22px;height:22px;font-size:11px;}
  .pp-rev-opt.correct{background:#E3F0E5;color:#1F4A29;} .pp-rev-opt.wrong{background:#F8E1DC;color:#6E2416;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .pp-opt.correct, :root:not([data-theme="light"]) .pp-rev-opt.correct, :root:not([data-theme="light"]) .pp-dot.ok, :root:not([data-theme="light"]) .pp-explain.ok{background:#1F3525;color:#CFE8D4;}
    :root:not([data-theme="light"]) .pp-opt.wrong, :root:not([data-theme="light"]) .pp-rev-opt.wrong, :root:not([data-theme="light"]) .pp-dot.no, :root:not([data-theme="light"]) .pp-explain.no{background:#3A1F19;color:#F2CFC6;}
  }
  /* ---------- landing sections ---------- */
  .lp-section{padding:64px 0 24px;text-align:center;}
  .lp-section.alt{background:var(--surface-2);border-radius:var(--radius-lg);padding:56px 24px 40px;margin:24px 0;}
  .lp-title{font-size:32px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .lp-sub{color:var(--muted);font-size:16px;margin:0 auto;max-width:56ch;}
  .lp-bar{width:64px;height:3px;border-radius:3px;background:var(--accent-2);opacity:.6;margin:18px auto 44px;}
  .why-row{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;}
  .why-bubble{width:176px;height:176px;border-radius:50%;border:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:var(--surface);box-shadow:var(--shadow);}
  .why-bubble b.word{font-size:22px;}
  .why-bubble b{font-size:30px;font-weight:800;line-height:1.1;color:var(--text);}
  .why-bubble span{font-size:13.5px;font-weight:600;line-height:1.35;margin-top:6px;color:var(--text);}
  .why-note{color:var(--muted);font-size:14px;max-width:60ch;margin:34px auto 0;}
  .steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;}
  @media (max-width:860px){.steps-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.steps-row{grid-template-columns:1fr;}}
  .step-ico{width:72px;height:72px;margin:0 auto 16px;display:block;}
  .step h3{font-size:18px;font-weight:800;margin:0 0 8px;}
  .step h3 em{font-style:normal;color:var(--accent);margin-inline-end:4px;}
  .step p{color:var(--muted);font-size:14px;margin:0;line-height:1.65;}
  .price-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch;}
  @media (max-width:960px){.price-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.price-row{grid-template-columns:1fr;}}
  .price-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 20px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:center;}
  .price-card.featured{border:2px solid var(--accent);}
  .price-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap;}
  .price-name{font-size:18px;font-weight:800;color:var(--accent);margin:0 0 4px;}
  .price-tag{font-size:12.5px;color:var(--muted);margin:0 0 16px;min-height:2.6em;}
  .price-amount{font-size:38px;font-weight:800;line-height:1;}
  .price-cur{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .price-save{color:#C2773A;font-weight:700;font-size:14px;margin:12px 0 0;min-height:1.4em;}
  .price-per{font-size:13.5px;font-weight:600;margin:8px 0 14px;padding-top:10px;border-top:1px solid var(--border);}
  .price-list{list-style:none;padding:0;margin:0 0 20px;text-align:start;font-size:13.5px;flex:1;}
  .price-list li{padding:5px 0 5px 22px;position:relative;line-height:1.45;}
  html[dir="rtl"] .price-list li{padding:5px 22px 5px 0;}
  .price-list li::before{content:"";position:absolute;inset-inline-start:2px;top:10px;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);}
  .price-card .btn{width:100%;}
  .price-foot{color:var(--muted);font-size:12.5px;margin-top:22px;}
  /* scroll reveal: slides in from the reading-start side, staggered */
  .reveal{opacity:0;transform:translateX(-56px);transition:opacity .7s ease, transform .8s cubic-bezier(.2,.75,.25,1);transition-delay:calc(var(--i,0) * 140ms);}
  html[dir="rtl"] .reveal{transform:translateX(56px);}
  .reveal.in{opacity:1;transform:none;}
  .reveal.no-anim{transition:none;}
  @media (prefers-reduced-motion: reduce){.reveal,html[dir="rtl"] .reveal{opacity:1;transform:none;transition:none;}}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:36px 0 56px;}
  @media (max-width:760px){.hero{grid-template-columns:1fr;}}
  .hero.hero-solo{display:block;text-align:center;padding:56px 0 24px;}
  .hero.hero-solo h1{font-size:46px;max-width:18ch;margin-left:auto;margin-right:auto;}
  .hero.hero-solo p{margin-left:auto;margin-right:auto;max-width:58ch;}
  .hero.hero-solo .hero-actions{justify-content:center;}
  @media (max-width:600px){.hero.hero-solo h1{font-size:34px;}}
  .hero h1{font-weight:800;font-size:42px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em;}
  .hero h1 i{font-style:normal;color:var(--accent);}
  .hero p{color:var(--muted);font-size:16.5px;max-width:46ch;margin:0 0 28px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .stat-row{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap;}
  .stat b{font-size:26px;font-weight:800;display:block;}
  .stat span{font-size:12.5px;color:var(--muted);}

  .hero-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);overflow:hidden;}

  .hero-card>.row{position:relative;}
  .hero-card .row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .hero-card .row:last-child{border-bottom:none;}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--accent);flex-shrink:0;border:1px solid var(--border);}
  .hero-card .who b{display:block;font-size:14.5px;}
  .hero-card .who span{font-size:12.5px;color:var(--muted);}
  .stars{color:var(--accent);font-size:13px;letter-spacing:1px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-weight:800;font-size:22px;margin:0;}
  .muted{color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;cursor:pointer;transition:border-color .15s ease;}
  .card:hover{border-color:var(--accent);}
  .card-top{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
  .card h3{margin:0;font-size:16px;}
  .ill-wrap{width:72px;height:72px;margin-bottom:14px;}
  .ill-wrap svg{width:100%;height:100%;}
  .card .prof{font-size:13px;color:var(--accent);font-weight:600;}
  .card p.bio{font-size:13.5px;color:var(--muted);margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--muted);margin:0 6px 6px 0;border:1px solid var(--border);}
  .card-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:10px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14.5px;}
  .field textarea{resize:vertical;min-height:90px;}
  #auth-form .field input, #reset-form .field input{height:50px;line-height:normal;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px;}
  .role-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
  @media (max-width:560px){.role-pick{grid-template-columns:1fr;}}
  .opt-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .opt-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13.5px;user-select:none;}
  .field .opt-pill input{width:auto;padding:0;border:0;background:none;accent-color:var(--accent);margin:0;}
  .opt-pill:has(input:checked){border-color:var(--accent);background:var(--surface-2);font-weight:600;}
  .form-section{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
  .detail-block{margin-bottom:18px;max-width:60ch;}
  .detail-block h4{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .call-note{font-size:12.5px;color:var(--muted);}
  .role-opt{border:1.5px solid var(--border);border-radius:var(--radius-md);padding:20px;cursor:pointer;text-align:start;background:var(--surface);}
  .role-opt.selected{border-color:var(--accent);background:var(--surface-2);}
  .role-opt b{display:block;font-size:16px;margin-bottom:4px;font-weight:800;}
  .role-opt span{font-size:13px;color:var(--muted);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;max-width:560px;}
  .panel.wide{max-width:none;}

  .detail-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;}
  .detail-head .avatar{width:64px;height:64px;font-size:22px;}
  .detail-head h2{margin:0 0 4px;font-weight:800;}
  .rate-badge{margin-inline-start:auto;text-align:end;}
  .rate-badge b{font-size:22px;font-weight:800;}

  .review{border-top:1px solid var(--border);padding:16px 0;}
  .review:first-child{border-top:none;padding-top:0;}
  .review-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;}
  .review-head b{font-size:13.5px;}
  .empty{text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius-md);font-size:14px;}
  .star-input{display:flex;gap:4px;font-size:22px;margin-bottom:14px;}
  .star-input span{cursor:pointer;color:var(--border);}
  .star-input span.on{color:var(--accent);}

  .chat{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);display:flex;flex-direction:column;height:520px;overflow:hidden;}
  .chat-log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:80%;padding:12px 15px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;line-height:1.6;}
  .msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);}
  .msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);}
  .chat-input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);}
  .chat-input textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14.5px;max-height:100px;}
  .coach-modes{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .mode-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);}
  .mode-btn.active{background:var(--surface-2);color:var(--text);border-color:var(--accent);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:50;}
  .banner{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 18px;font-size:13.5px;color:var(--muted);margin-bottom:24px;}
  .req-item{border-top:1px solid var(--border);padding:14px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .req-item:first-child{border-top:none;padding-top:0;}
  .status-pill{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;height:fit-content;}
  .status-pill.accepted{color:var(--accent-2);border-color:var(--accent-2);}
  .status-pill.declined{color:var(--danger);border-color:var(--danger);}
  .status-pill.paid{color:var(--accent);border-color:var(--accent);}
  footer{text-align:center;padding:40px 0 10px;color:var(--muted);font-size:12.5px;}
  footer a.ig-link{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-top:8px;}
  footer a.ig-link:hover{color:var(--text);}
  html[dir="rtl"] .brand .mark, html[dir="rtl"] .hero h1, html[dir="rtl"] .stars{letter-spacing:normal;}
</style>
</head>

// --- Availability / slot picking ---
const AVAIL_DAYS = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri']; // JS getDay(): 0=Sun..6=Sat, reordered for display
const AVAIL_DAY_KEYS = {Sat:'day_sat',Sun:'day_sun',Mon:'day_mon',Tue:'day_tue',Wed:'day_wed',Thu:'day_thu',Fri:'day_fri'};
const AVAIL_BLOCKS = [['morning','09:00','slot_morning'], ['afternoon','13:00','slot_afternoon'], ['evening','17:00','slot_evening']];
const JSDAY_TO_NAME = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; // matches Date#getDay()

// Given a mentor's weekly template (array like ["Mon-morning","Wed-evening"]) and existing requests,
// returns concrete upcoming slots for the next 14 days that are (a) in the template and (b) not already booked.
function upcomingSlotsFor(mentorId, template){
  const tmpl = new Set(template||[]);
  if(!tmpl.size) return [];
  const taken = new Set(
    (cache.requests||[])
      .filter(r=> r.mentorId===mentorId && (r.status==='pending' || r.status==='accepted'))
      .map(r=> r.date+'|'+r.time)
  );
  const out = [];
  const now = new Date();
  for(let i=0;i<14;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    const dayName = JSDAY_TO_NAME[d.getDay()];
    for(const [blockKey, time, labelKey] of AVAIL_BLOCKS){
      if(!tmpl.has(dayName+'-'+blockKey)) continue;
      const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(taken.has(dateStr+'|'+time)) continue;
      out.push({ date: dateStr, time, dayName, labelKey, dateObj: d });
    }
  }
  return out;
}
function formatSlotLabel(slot){
  const d = slot.dateObj;
  const md = (d.getMonth()+1)+'/'+d.getDate();
  return T(AVAIL_DAY_KEYS[slot.dayName]) + ' ' + md + ' · ' + T(slot.labelKey);
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout: '+label+' did not respond in '+(ms/1000)+'s — check that your Supabase project is Active (not Paused) at supabase.com')), ms))
  ]);
}

function makeSupabaseDB(){
  return {
    doc(path){
      const [col, id] = path.split('/');
      return {
        async set(data){ const { error } = await sb.from(col).upsert(Object.assign({id}, data)); if(error) throw error; },
        async update(patch){ const { error } = await sb.from(col).update(patch).eq('id', id); if(error) throw error; },
        async delete(){ const { error } = await sb.from(col).delete().eq('id', id); if(error) throw error; },
        onSnapshot(cb){
          let cancelled = false;
          async function fetchOnce(){
            const { data } = await sb.from(col).select('*').eq('id', id).maybeSingle();
            if(!cancelled) cb({ id, data: data || null });
          }
          fetchOnce();
          const channel = sb.channel('doc-'+col+'-'+id)
            .on('postgres_changes', { event:'*', schema:'public', table: col, filter:'id=eq.'+id }, fetchOnce)
            .subscribe();
          return ()=>{ cancelled = true; sb.removeChannel(channel); };
        }
      };
    },
    collection(col){
      return {
        where(field, op, value){
          return {
            onSnapshot(cb){
              let cancelled = false;
              async function fetchAll(){
                let q = sb.from(col).select('*');
                if(op==='==') q = q.eq(field, value);
                const { data } = await q;
                if(!cancelled) cb((data||[]).map(row=>({ id: row.id, data: row })));
              }
              fetchAll();
              const channel = sb.channel('col-'+col+'-'+field+'-'+String(value))
                .on('postgres_changes', { event:'*', schema:'public', table: col }, fetchAll)
                .subscribe();
              return ()=>{ cancelled = true; sb.removeChannel(channel); };
            }
          };
        }
      };
    }
  };
}

async function init(){
  if(!sb){
    document.getElementById('app').innerHTML = `<div class="empty" style="margin-top:80px;">Workar isn't connected to a database yet.<br>Add your Supabase URL and key in the code to enable it.</div>`;
    return;
  }

  // Public data — visible to everyone, signed in or not.
  const db = makeSupabaseDB();
  window.__db = db;
  db.doc('site_settings/main').onSnapshot(d=>{
    siteSettings = (d && d.data && d.data.data) || {};
    render();
  });
  db.collection('profiles').where('role','==','mentor').onSnapshot(list=>{
    cache.profiles = {};
    (list||[]).forEach(d=>{ cache.profiles[d.id] = d.data; });
    render();
  });

  let session;
  try{
    const res = await withTimeout(sb.auth.getSession(), 8000, 'getSession');
    session = res.data.session;
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="empty" style="margin-top:80px;">Could not connect. <br><span style="font-size:12px;opacity:0.7;">${(e && (e.message || e.error_description || JSON.stringify(e))) || ''}</span></div>`;
    return;
  }
  if(IS_RECOVERY_LINK) state.recoveryMode = true;
  if(session){
    onSignedIn(session);
  } else {
    render(); // home/browse are visible; only onboard/dashboard prompt for login
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){
      state.recoveryMode = true;
      if(session && !uid) onSignedIn(session); else render();
      return;
    }
    if(event==='SIGNED_OUT'){
      uid = null; userEmail = null; myProfile = null;
      state.view = 'home';
      render();
    } else if(event==='SIGNED_IN' && session && !uid){
      onSignedIn(session);
    }
  });
}

/* ---------- AI calls, proxied through /api/ai (key stays server-side on Vercel) ---------- */
async function callAI(payload){
  const res = await fetch('/api/ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ userId: uid }, payload))
  });
  if(res.status === 402){
    const err = new Error('no-credits');
    err.noCredits = true;
    throw err;
  }
  if(!res.ok) throw new Error('api-error-'+res.status);
  const data = await res.json();
  if(myProfile && data.aiCreditsRemaining !== null && data.aiCreditsRemaining !== undefined){
    myProfile.aiCredits = data.aiCreditsRemaining;
  }
  return data.text || '';
}

function countUp(node){
  const target = Number(node.getAttribute('data-count'))||0;
  if(target<=0){ node.textContent = target; return; }
  const dur = 1100, t0 = performance.now();
  const step = now=>{
    const k = Math.min(1,(now-t0)/dur);
    node.textContent = Math.round(target*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function setupReveal(){
  const items = document.querySelectorAll('.reveal[data-rk]');
  if(!items.length) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const show = (node, animate)=>{
    const key = node.getAttribute('data-rk');
    if(!animate) node.classList.add('no-anim');
    node.classList.add('in');
    const c = node.querySelector('[data-count]');
    if(c){ if(animate && !reduce) countUp(c); else c.textContent = c.getAttribute('data-count'); }
    revealedKeys.add(key);
  };
  if(!('IntersectionObserver' in window)){ items.forEach(n=>show(n,false)); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ show(e.target, true); io.unobserve(e.target); } });
  }, { threshold: 0.2, rootMargin: '0px 0px -40px 0px' });
  items.forEach(n=>{
    if(revealedKeys.has(n.getAttribute('data-rk'))) show(n, false);
    else io.observe(n);
  });
}

function wireAdmin(){
  const saveBtn = document.getElementById('adm-save');
  if(!saveBtn) return;
  const collect = ()=>{
    const featured = (document.querySelector('input[name="adm-featured"]:checked')||{}).value;
    const packages = Array.from(document.querySelectorAll('tr[data-pk]')).map(tr=>({
      key: tr.getAttribute('data-pk'),
      price: Math.max(0, Number(tr.querySelector('[data-f="price"]').value)||0),
      sessions: Math.max(1, parseInt(tr.querySelector('[data-f="sessions"]').value)||1),
      featured: tr.getAttribute('data-pk')===featured,
      hidden: !tr.querySelector('[data-f="show"]').checked
    }));
    const text = { en:{}, fa:{} };
    document.querySelectorAll('.adm-row').forEach(row=>{
      const key = row.getAttribute('data-key');
      row.querySelectorAll('.adm-txt').forEach(t=>{
        const lang = t.getAttribute('data-lang');
        const v = t.value;
        if(v.trim() && v !== defaultT(lang,key)) text[lang][key] = v;
      });
    });
    return { packages, text };
  };
  const persist = async (data, msg)=>{
    saveBtn.disabled = true;
    try{
      await window.__db.doc('site_settings/main').set({ data });
      siteSettings = data; toast(msg); render();
    }catch(err){
      console.error('settings save failed:', err);
      toast(T('adm_save_fail')); saveBtn.disabled = false;
    }
  };
  saveBtn.addEventListener('click', ()=> persist(Object.assign({}, siteSettings, collect()), T('adm_saved')));
  document.getElementById('adm-reset').addEventListener('click', ()=>{
    if(confirm(T('adm_reset_confirm'))) persist({}, T('adm_saved'));
  });
  // live-update the save % column when prices change
  document.querySelectorAll('.adm-in').forEach(inp=>inp.addEventListener('input', ()=>{
    const rows = Array.from(document.querySelectorAll('tr[data-pk]'));
    const val = (tr,f)=>Number(tr.querySelector('[data-f="'+f+'"]').value)||0;
    const base = val(rows[0],'sessions') ? val(rows[0],'price')/val(rows[0],'sessions') : 0;
    rows.forEach(tr=>{
      const ss = val(tr,'sessions'), pr = val(tr,'price');
      const sv = (base && ss>1) ? Math.max(0, Math.round((1 - pr/(base*ss))*100)) : 0;
      tr.children[3].textContent = sv ? sv+'%' : '—';
    });
  }));
}

const PREP_LETTERS = ['A','B','C','D','E','F'];

try{ const saved = localStorage.getItem('workar_prep_session'); if(saved){ prep.session = JSON.parse(saved); } }catch(e){}
function savePrepSession(){ try{ prep.session ? localStorage.setItem('workar_prep_session', JSON.stringify(prep.session)) : localStorage.removeItem('workar_prep_session'); }catch(e){} }

async function loadPrep(force){
  if(!sb || prep.loading || (prep.loaded && !force)) return;
  prep.loading = true;
  try{
    const { data: ex } = await sb.from('exams').select('*').order('sortOrder');
    prep.exams = (ex||[]).filter(e=> e.published || isAdmin());
    if(uid){
      const { data: pu } = await sb.from('exam_purchases').select('examId');
      prep.purchases = (pu||[]).map(p=>p.examId);
      const { data: at } = await sb.from('exam_attempts').select('*').order('createdAt',{ascending:false}).limit(40);
      prep.attempts = at || [];
    } else { prep.purchases = []; prep.attempts = []; }
  }catch(e){ console.error('prep load failed', e); }
  prep.loaded = true; prep.loading = false;
  if(state.view==='prep' || state.view==='prepAdmin') render();
}
function prepHasAccess(ex){ return !!ex && (ex.isFree || isAdmin() || prep.purchases.includes(ex.id) || prep.purchases.includes('all')); }
function prepBest(examId){ const a = prep.attempts.filter(x=>x.examId===examId && x.total); return a.length ? Math.max(...a.map(x=>Math.round(100*x.score/x.total))) : null; }
function prepBundlePrice(){ return Number(siteSettings && siteSettings.prepBundlePrice) || 24.99; }
function prepMoney(n){ n = Number(n)||0; return '$' + (n % 1 ? n.toFixed(2) : n); }
function prepBand(pct){ if(pct>=80) return ['above',T('band_above')]; if(pct>=65) return ['target',T('band_target')]; if(pct>=50) return ['below',T('band_below')]; return ['needs',T('band_needs')]; }
function prepDomLabel(d){ const k='dom_'+String(d).replace(/\s+/g,'_').toLowerCase(); const t=T(k); return t===k ? d : t; }
function prepShuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function prepIsRight(q, sel){ const a=(sel||[]).slice().sort().join(','), b=q.correct.slice().sort().join(','); return a.length>0 && a===b; }
function prepFmtTime(ms){ ms=Math.max(0,ms); const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }

async function startPrepExam(examId, mode, onlyIds){
  const ex = prep.exams.find(e=>e.id===examId);
  if(!ex) return;
  prep.busy = true; render();
  const { data, error } = await sb.from('exam_questions').select('*').eq('examId', examId).order('sortOrder');
  prep.busy = false;
  if(error || !data || !data.length){ toast(T(prepHasAccess(ex) ? 'prep_load_fail' : 'prep_locked_msg')); render(); return; }
  let rows = onlyIds ? data.filter(r=>onlyIds.includes(r.id)) : data;
  const qs = prepShuffle(rows).map(r=>{
    const opts = Array.isArray(r.options) ? r.options : [];
    const cor = (Array.isArray(r.correct) ? r.correct : []).map(Number);
    const order = prepShuffle(opts.map((_,i)=>i));
    return { id:r.id, domain:r.domain||'Process', prompt:r.prompt, options:order.map(i=>opts[i]),
             correct: order.map((oi,di)=>cor.includes(oi)?di:-1).filter(x=>x>=0), explanation:r.explanation||'' };
  });
  const mins = onlyIds ? Math.max(3, Math.round(qs.length*1.28)) : (ex.timeMinutes || Math.round(qs.length*1.28));
  prep.session = { examId, title:ex.title, mode, qs, idx:0, ans:{}, checked:{}, flags:[], startedAt:Date.now(),
                   deadline: mode==='exam' ? Date.now()+mins*60000 : null, finished:false, result:null, isRetry:!!onlyIds };
  prep.screen = 'run'; prep.pickExam = null; savePrepSession(); render(); window.scrollTo(0,0);
}

async function finishPrep(){
  const s = prep.session; if(!s || s.finished) return;
  if(prep.timer){ clearInterval(prep.timer); prep.timer = null; }
  const byDomain = {}; let score = 0;
  s.qs.forEach(q=>{ const ok = prepIsRight(q, s.ans[q.id]); if(ok) score++; const d = byDomain[q.domain] || (byDomain[q.domain]={c:0,t:0}); d.t++; if(ok) d.c++; });
  s.finished = true; s.result = { score, total:s.qs.length, byDomain, usedMs: Date.now()-s.startedAt };
  prep.screen = 'results'; prep.review = 'all'; savePrepSession(); render(); window.scrollTo(0,0);
  if(uid){
    try{
      await sb.from('exam_attempts').insert({ id:'att_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), userId:uid, examId:s.examId, mode:s.isRetry?'retry':s.mode, score, total:s.qs.length, byDomain });
      loadPrep(true);
    }catch(e){ console.error('attempt save failed', e); }
  }
}

function wirePrep(){
  if(prep.timer){ clearInterval(prep.timer); prep.timer = null; }
  const s = prep.session;
  const on = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click', ()=>{ prep.pickExam = b.getAttribute('data-pick'); render(); }));
  document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click', ()=>{
    if(prep.session && !prep.session.finished && !confirm(T('prep_replace_confirm'))) return;
    startPrepExam(b.getAttribute('data-start'), b.getAttribute('data-mode'));
  }));
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>buyPrep(b.getAttribute('data-buy'))));
  on('pp-resume', ()=>{ prep.screen='run'; if(s && s.mode==='exam' && s.pausedLeft){ s.deadline = Date.now()+s.pausedLeft; delete s.pausedLeft; } render(); });
  on('pp-discard', ()=>{ if(confirm(T('prep_discard_confirm'))){ prep.session=null; savePrepSession(); render(); } });

  if(prep.screen==='run' && s && !s.finished){
    const q = s.qs[s.idx];
    document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click', ()=>prepSelect(parseInt(b.getAttribute('data-opt'),10))));
    on('pp-check', ()=>{ if((s.ans[q.id]||[]).length){ s.checked[q.id]=true; savePrepSession(); render(); } });
    on('pp-next', ()=>{ s.idx=Math.min(s.qs.length-1, s.idx+1); savePrepSession(); render(); window.scrollTo(0,0); });
    on('pp-prev', ()=>{ s.idx=Math.max(0, s.idx-1); savePrepSession(); render(); window.scrollTo(0,0); });
    on('pp-flag', ()=>{ const i=s.flags.indexOf(q.id); if(i>=0) s.flags.splice(i,1); else s.flags.push(q.id); savePrepSession(); render(); });
    const doFinish = ()=>{ const un = s.qs.filter(x=>!(s.ans[x.id]||[]).length).length;
      if(un && !confirm(T('prep_unanswered_confirm').replace('{n}', un))) return; finishPrep(); };
    on('pp-finish', doFinish); on('pp-finish-any', doFinish);
    on('pp-exit', ()=>{ if(s.mode==='exam') s.pausedLeft = Math.max(0, s.deadline-Date.now()); prep.screen='home'; savePrepSession(); render(); });
    document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', ()=>{ s.idx=parseInt(b.getAttribute('data-go'),10); savePrepSession(); render(); }));
    if(s.mode==='exam'){
      const tick = ()=>{ const el=document.getElementById('prep-timer'); const left=s.deadline-Date.now();
        if(el){ el.textContent = prepFmtTime(left); el.classList.toggle('warn', left < 5*60000); }
        if(left<=0){ toast(T('prep_time_up')); finishPrep(); } };
      tick(); prep.timer = setInterval(tick, 1000);
    }
  }
  if(prep.screen==='results' && s && s.finished){
    document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click', ()=>{ prep.review=b.getAttribute('data-review'); render(); }));
    on('pp-retry-wrong', ()=>{ const ids = s.qs.filter(q=>!prepIsRight(q,s.ans[q.id])).map(q=>q.id); startPrepExam(s.examId, 'practice', ids); });
    on('pp-retake', ()=>{ prep.pickExam = s.examId; prep.session=null; savePrepSession(); prep.screen='home'; render(); window.scrollTo(0,0); });
    on('pp-back', ()=>{ prep.screen='home'; render(); window.scrollTo(0,0); });
  }
}
function prepSelect(i){
  const s = prep.session; if(!s || s.finished) return; const q = s.qs[s.idx];
  if(s.mode==='practice' && s.checked[q.id]) return;
  if(i<0 || i>=q.options.length) return;
  let sel = (s.ans[q.id]||[]).slice();
  if(q.correct.length>1){ sel = sel.includes(i) ? sel.filter(x=>x!==i) : sel.concat(i); }
  else sel = [i];
  s.ans[q.id] = sel; savePrepSession(); render();
}
document.addEventListener('keydown', e=>{
  if(state.view!=='prep' || prep.screen!=='run' || !prep.session || prep.session.finished) return;
  if(/input|textarea|select/i.test((e.target && e.target.tagName)||'')) return;
  const k = e.key.toUpperCase();
  const li = PREP_LETTERS.indexOf(k);
  if(li>=0){ prepSelect(li); e.preventDefault(); return; }
  if(/^[1-6]$/.test(k)){ prepSelect(parseInt(k,10)-1); e.preventDefault(); return; }
  if(e.key==='Enter'){ const b = document.getElementById('pp-check') || document.getElementById('pp-next'); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
  if(e.key==='ArrowRight'){ const b=document.getElementById('pp-next'); if(b) b.click(); }
  if(e.key==='ArrowLeft'){ const b=document.getElementById('pp-prev'); if(b && !b.disabled) b.click(); }
});

function prepCsvParse(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function prepCsvToQuestions(text){
  const rows = prepCsvParse(text); if(!rows.length) return { qs:[], errors:['empty'] };
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  const optCols = ['option_a','option_b','option_c','option_d','option_e','option_f'].map(col);
  const qs = [], errors = [];
  rows.slice(1).forEach((r,ri)=>{
    const get = n => { const c=col(n); return c>=0 ? String(r[c]||'').trim() : ''; };
    const prompt = get('question'); const opts = optCols.map(c=>c>=0?String(r[c]||'').trim():'').filter(Boolean);
    const letters = get('correct').toUpperCase().replace(/[^A-F]/g,'').split('');
    const correct = [...new Set(letters.map(l=>PREP_LETTERS.indexOf(l)))].filter(i=>i>=0 && i<opts.length);
    let domain = get('domain') || 'Process';
    const dl = domain.toLowerCase(); domain = dl.startsWith('peo') ? 'People' : dl.startsWith('bus') ? 'Business Environment' : dl.startsWith('pro') ? 'Process' : domain;
    if(!prompt || opts.length<2 || !correct.length){ errors.push(ri+2); return; }
    qs.push({ domain, prompt, options:opts, correct, explanation: get('explanation') });
  });
  return { qs, errors };
}
function prepCsvCell(v){ v = String(v==null?'':v); return /[",\n\r;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function prepDownload(name, text){
  const blob = new Blob(['\uFEFF'+text], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

        await sb.from('exams').update({ questionCount: count||0 }).eq('id', id);
        toast(T('prep_csv_done').replace('{n}', rows.length) + (errors.length ? ' · ' + T('prep_csv_skipped').replace('{r}', errors.slice(0,8).join(', ')) : ''), 6000);
        loadPrep(true);
      }catch(e){ console.error(e); toast(T('adm_save_fail')); }
    });
    box.querySelector('[data-pa="delete"]').addEventListener('click', async ()=>{
      if(!confirm(T('prep_delete_confirm'))) return;
      const { error } = await sb.from('exams').delete().eq('id', id);
      if(error){ toast(T('adm_save_fail')); return; } toast(T('toast_saved')); loadPrep(true);
    });
  });
}

function wireAuth(){
  const toggle = document.getElementById('auth-toggle');
  if(toggle) toggle.addEventListener('click', (e)=>{
    e.preventDefault();
    state.authMode = state.authMode==='login' ? 'signup' : 'login';
    state.authError = ''; state.authCheckEmail = false; state.authInfo = '';
    render();
  });
  const forgotLink = document.getElementById('auth-forgot');
  if(forgotLink) forgotLink.addEventListener('click', (e)=>{
    e.preventDefault();
    const em = document.querySelector('#auth-form input[name="email"]');
    if(em && em.value) state.authEmail = em.value.trim();
    state.authMode = 'forgot'; state.authError = ''; state.authInfo = ''; state.authCheckEmail = false;
    render();
  });
  const resendBtn = document.getElementById('auth-resend');
  if(resendBtn) resendBtn.addEventListener('click', async ()=>{
    if(!state.authEmail) return;
    state.resendBusy = true; render();
    try{
      const { error } = await withTimeout(sb.auth.resend({ type:'signup', email: state.authEmail, options:{ emailRedirectTo: window.location.origin } }), 8000, 'resend');
      if(error) throw error;
      state.resendDone = true;
    }catch(err){ state.authError = (err && err.message) || T('auth_error_generic'); }
    state.resendBusy = false; render();
  });
  const form = document.getElementById('auth-form');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(state.authBusy) return;
    const fd = new FormData(form);
    const email = (fd.get('email')||'').trim();
    const password = fd.get('password')||'';
    state.authBusy = true; state.authError = ''; render();
    try{
      if(state.authMode==='forgot'){
        state.authEmail = email;
        const { error } = await withTimeout(sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin }), 8000, 'resetPassword');
        if(error) throw error;
        state.authBusy = false; state.authMode = 'login'; state.authInfo = T('reset_sent'); render();
        return;
      }
      if(state.authMode==='signup'){
        if(password !== (fd.get('password2')||'')){
          state.authBusy = false; state.authError = T('pw_mismatch'); render();
          const em = document.querySelector('#auth-form input[name="email"]'); if(em) em.value = email;
          return;
        }
        const { data, error } = await withTimeout(sb.auth.signUp({ email, password, options:{ emailRedirectTo: window.location.origin } }), 8000, 'signUp');
        if(error) throw error;
        state.authEmail = email;
        if(data.session){
          onSignedIn(data.session);
        } else if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          // email already registered
          state.authBusy = false; state.authMode = 'login'; state.authCheckEmail = false;
          state.authInfo = T('auth_already_registered'); render();
        } else {
          state.authBusy = false; state.authMode = 'login'; state.authCheckEmail = true;
          state.resendDone = false; state.authInfo = ''; render();
        }
      } else {
        state.authEmail = email;
        const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password }), 8000, 'signInWithPassword');
        if(error){
          if(/not confirmed/i.test(error.message||'')){ state.authBusy=false; state.authCheckEmail=true; state.authError=''; render(); return; }
          throw error;
        }
        onSignedIn(data.session);
      }
    }catch(err){
      state.authBusy = false;
      state.authError = (err && err.message) || T('auth_error_generic');
      render();
    }
  });
}

          </label>`;}).join('')}
      </div>

      <label style="display:block;margin-bottom:8px;">${esc(T('choose_slot_title'))}</label>
      ${slots.length ? `
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
        ${slots.map(s=>`<button type="button" class="btn btn-sm ${state.selectedSlot && state.selectedSlot.date===s.date && state.selectedSlot.time===s.time ? 'btn-primary':'btn-outline'} slot-btn" data-date="${s.date}" data-time="${s.time}">${esc(formatSlotLabel(s))}</button>`).join('')}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;">
        <div class="field"><label>${esc(T('lbl_date'))}</label><input type="date" id="book-date" min="${new Date().toISOString().slice(0,10)}" value="${esc((state.selectedSlot&&state.selectedSlot.date)||'')}"></div>
        <div class="field"><label>${esc(T('lbl_time'))}</label><input type="time" id="book-time" step="900" value="${esc((state.selectedSlot&&state.selectedSlot.time)||'')}"></div>
      </div>`}
      <div class="field"><label>${esc(T('lbl_message'))}</label><textarea id="book-message" placeholder="${esc(T('ph_message'))}"></textarea></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary btn-sm" id="book-submit" ${state.selectedSlot?'':'disabled'}>${esc(T('send_request'))}</button>
        <button class="btn btn-ghost btn-sm" id="book-cancel">${esc(T('cancel'))}</button>
      </div>
    </div>`;
    })() : `<button class="btn btn-primary" id="request-btn">${esc(T('book_session'))}</button>`)}
  </div>` : `<div class="banner">${esc(T('this_is_profile'))}</div>`}

  <div class="section-head"><h2>${esc(T('reviews_title'))}</h2></div>
  ${iAmClient && !isSelf ? `
  <div class="panel" style="margin-bottom:24px;">
    <form id="review-form">
      <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px;">${esc(T('rate_experience'))}</label>
      <div class="star-input" id="star-input">${[1,2,3,4,5].map(n=>`<span data-star="${n}" class="${n<=state.ratingDraft?'on':''}">★</span>`).join('')}</div>
      <div class="field"><textarea name="text" placeholder="${esc(T('ph_review'))}" required></textarea></div>
      <button class="btn btn-primary btn-sm" type="submit">${esc(T('post_review'))}</button>
    </form>
  </div>` : ''}
  ${reviews.length ? reviews.slice().reverse().map(r=>`
    <div class="review">
      <div class="review-head"><b>${esc(nameOf(r.clientId))}</b><span class="stars">${starsStr(r.rating)}</span></div>
      <div class="muted" style="font-size:14px;">${esc(r.text)}</div>
    </div>`).join('') : `<div class="empty">${esc(T('no_reviews'))}</div>`}
  `;
}

      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="status-pill ${r.paid ? 'paid' : r.status}">${r.paid ? esc(T('paid_badge')) : esc(r.status)}</span>
        ${isMentor && r.status==='pending' ? `
          <button class="btn btn-sm btn-outline" data-req="${r.id}" data-status="accepted">${esc(T('accept'))}</button>
          <button class="btn btn-sm btn-ghost" data-req="${r.id}" data-status="declined">${esc(T('decline'))}</button>
        ` : ''}
        ${r.status==='accepted' && r.amountCents>0 && !r.paid ? (
          isMentor
            ? `<span class="muted" style="font-size:12.5px;">${esc(T('waiting_for_payment'))}</span>`
            : `<button class="btn btn-sm btn-primary" data-pay="${r.id}" data-amount="${r.amountCents}" data-mentor="${r.mentorId}">${esc(T('pay_to_confirm').replace('${amount}', (r.amountCents/100).toFixed(2)))}</button>`
        ) : ''}
        ${r.status==='accepted' && (!r.amountCents || r.paid) ? `
          <button class="btn btn-sm btn-primary" data-call="${r.id}" data-mode="video" title="${esc(T('call_tip'))}">${esc(T('btn_video_call'))}</button>
          <button class="btn btn-sm btn-outline" data-call="${r.id}" data-mode="voice" title="${esc(T('call_tip'))}">${esc(T('btn_voice_call'))}</button>` : ''}
        ${r.status==='pending' ? `<span class="call-note">${esc(T('call_after_accept'))}</span>` : ''}
